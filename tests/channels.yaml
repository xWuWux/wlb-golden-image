    owner: platform
    test: acceptance/46-kanaly-eksportu
    why: >-
      dane dostarczone do przegladarki badacza moga byc zapisane; pelna egzekucja wymaga VDI/DLP #18

  - id: CL-CLIPBOARD
    direction: export
    surface: client
    expected: known_open
    required: false
    probe: {type: capture, tool: manual, fixture: none}
    evidence: R
    owner: platform
    test: acceptance/46-kanaly-eksportu
    why: >-
      dane dostarczone do przegladarki badacza moga byc zapisane; pelna egzekucja wymaga VDI/DLP #18

  - id: CL-SCREENSHOT
    direction: export
    surface: client
    expected: known_open
    required: false
    probe: {type: capture, tool: manual, fixture: none}
    evidence: R
    owner: platform
