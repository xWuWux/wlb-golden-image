# Matryca kanałów eksportu/importu (#292, inkrement 1) — jedno źródło prawdy dla testów,
# raportu CI (`build/ci-logs/channels-*/channels.json`) i dokumentacji.
# Walidacja schematu: tests/unit/test_channels_matrix.py. Harness: tests/acceptance.d/46-kanaly-eksportu.sh.
#
# expected:
#   denied     — polityka WLB wymaga odmowy. Asercja bramkuje TYLKO przy WLB_CHANNEL_GATING=1;
#                bez gatingu niezgodność daje SKIP (nigdy fałszywy PASS — jak #138).
#   allowed    — kanał dozwolony polityką; wpis z `control: true` jest kontrolą pozytywną grupy
#                (jej błąd unieważnia asercje `denied` w tej samej grupie).
#   known_open — ryzyko szczątkowe/poza zasięgiem testu; TYLKO raport, nigdy asercja (wymaga `why`).
#
# probe.type: http | fs | network | version | capture
# Grupa = surface (jupyter, jamovi, desktop, network, rstudio); owner = zespół odpowiedzialny.
schema: wlb.channels/v1
channels:
  # --- Jupyter HTTP (4.x): API serwera notebooków przez Traefik ---
  - id: JL-API-READ
    direction: internal
    surface: jupyter
    expected: allowed
    control: true
    probe: {type: http, method: GET, path: "/user/{user}/api/contents?content=0", expect_status: 200}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # Zapis notebooka/pliku w domu — ten sam endpoint, którego JupyterLab używa do edycji.
  # To NIE dowodzi pochodzenia pliku (drag-and-drop uploadu nie da się odróżnić od zapisu — #292 §6).
  - id: JL-SAVE
    direction: internal
    surface: jupyter
    expected: allowed
    probe:
      type: http
      method: PUT
      path: "/user/{user}/api/contents/wlb-kanaly-probe.txt"
      body: '{"type": "file", "format": "text", "content": "wlb-kanaly-probe"}'
      expect_status: [200, 201]
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: JL-FILES-DL
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/files/wlb-kanaly-probe.csv?download=1", expect_status: 403}
    evidence: RV
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # /api/nbconvert (nowe API Jupyter Server) NIE jest objęte regułą Traefika dla /nbconvert —
  # dlatego osobny wpis matrycy (dziura do zamknięcia po stronie reguły, #292 §5.2).
  - id: JL-NBCONVERT
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/nbconvert?format=pdf&download=1", expect_status: 403}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # Warianty ścieżek — każdy osobny wpis, inaczej jeden `..` daje fałszywe poczucie zamknięcia.
  - id: JL-TRAVERSAL-DOTDOT
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/contents/../../etc/passwd?content=1", expect_status: 403}
    evidence: RV
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: JL-TRAVERSAL-ENCODED
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/contents/%2e%2e/%2e%2e/etc/passwd?content=1", expect_status: 403}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: JL-TRAVERSAL-SLASH
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/contents//etc/passwd?content=1", expect_status: 403}
    evidence: RV
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: JL-TRAVERSAL-DOT
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/contents/./../../etc/passwd?content=1", expect_status: 403}
    evidence: RV
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: JL-TRAVERSAL-ABS
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/contents/%2Fetc%2Fpasswd?content=1", expect_status: 403}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # Symlink w domu badacza wskazujący poza korzeń ContentsManagera (do /etc/passwd).
  - id: JL-TRAVERSAL-SYMLINK
    direction: export
    surface: jupyter
    expected: denied
    probe: {type: http, method: GET, path: "/user/{user}/api/contents/wlb-passwd-link?content=1", expect_status: 403}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # --- jamovi (Flatpak, 3.x): sandbox bwrap i jego widok systemu plików ---
  - id: JM-SANDBOX-HOME-READ
    direction: internal
    surface: jamovi
    expected: allowed
    control: true
    probe: {type: fs, path: "~", operation: read, expect_exit: 0}
    evidence: RV
    owner: histologia
    test: acceptance/46-kanaly-eksportu

  - id: JM-SLUIZA-IN-READ
    direction: import
    surface: jamovi
    expected: allowed
    probe: {type: fs, path: /sluza-in, operation: read, expect_exit: 0}
    evidence: RV
    owner: histologia
    test: acceptance/46-kanaly-eksportu

  - id: JM-SLUIZA-OUT-WRITE
    direction: export
    surface: jamovi
    expected: allowed
    probe: {type: fs, path: /sluza-out, operation: write, expect_exit: 0}
    evidence: RV
    owner: histologia
    test: acceptance/46-kanaly-eksportu

  - id: JM-ETC-SHADOW-READ
    direction: export
    surface: jamovi
    expected: denied
    probe: {type: fs, path: /etc/shadow, operation: read, expect_exit: nonzero}
    evidence: RV
    owner: histologia
    test: acceptance/46-kanaly-eksportu

  # Inny badacz na tej samej VM: /workspace jest w sandboxie, ale domy badaczy mają 0700.
  - id: JM-U02-READ
    direction: export
    surface: jamovi
    expected: denied
    probe: {type: fs, path: "/workspace/jupyter-{other}", operation: read, expect_exit: nonzero}
    evidence: RV
    owner: histologia
    test: acceptance/46-kanaly-eksportu

  - id: JM-U02-WRITE
    direction: import
    surface: jamovi
    expected: denied
    probe: {type: fs, path: "/workspace/jupyter-{other}", operation: write, expect_exit: nonzero}
    evidence: RV
    owner: histologia
    test: acceptance/46-kanaly-eksportu

  # --- Pulpit (noVNC/jrdp, 4.1): system plików widziany przez sesję badacza ---
  - id: DT-SLUIZA-OUT-WRITE
    direction: export
    surface: desktop
    expected: allowed
    control: true
    probe: {type: fs, path: /sluza-out, operation: write, expect_exit: 0}
    evidence: RV
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: DT-SLUIZA-IN-WRITE
    direction: import
    surface: desktop
    expected: denied
    probe: {type: fs, path: /sluza-in, operation: write, expect_exit: nonzero}
    evidence: RV
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # Pin audytowanej wersji jrdp (#140/#277): zmiana wersji wymaga ponownego audytu kanałów
  # (noVNC w 3.0.1 nie ma UI transferu plików). Niezgodność = FAIL zawsze, niezależnie od gatingu.
  - id: DT-JRDP-VERSION
    direction: internal
    surface: desktop
    expected: allowed
    probe: {type: version, package: jupyter-remote-desktop-proxy, expect_version: "3.0.1"}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # --- Sieć (6.1): egress przez proxy z allowlistą i bezpośrednio (nftables) ---
  - id: NET-PROXY-MIRROR
    direction: export
    surface: network
    expected: allowed
    control: true
    probe: {type: network, via: proxy, target: mirror, expect_status: 200}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: NET-PROXY-EXTERNAL
    direction: export
    surface: network
    expected: denied
    probe: {type: network, via: proxy, target: "http://example.com/", expect_status: 403}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  - id: NET-DIRECT-IP
    direction: export
    surface: network
    expected: denied
    probe: {type: network, via: direct, target: "http://1.1.1.1/", expect_exit: nonzero}
    evidence: V
    owner: platform
    test: acceptance/46-kanaly-eksportu

  # --- RStudio (2.x): placeholder — fixture ścieżek transferu nie istnieje ---
  # Capture mitmproxy i lista ścieżek upload/download/export to osobny inkrement (#292 PR-T3).
  # Do tego czasu raportujemy ryzyko jako known_open (SKIP z właścicielem), nie udajemy PASS.
  - id: RS-TRANSFER-PATHS
    direction: export
    surface: rstudio
    expected: known_open
    probe: {type: capture, tool: mitmproxy, fixture: tests/fixtures/rstudio-transfer-paths.txt}
    evidence: R
    owner: rstudio
    test: acceptance/46-kanaly-eksportu
    why: >-
      Brak fixture `tests/fixtures/rstudio-transfer-paths.txt` — ścieżki upload/download/export
      RStudio trzeba najpierw przechwycić mitmproxy na VM. Osobny inkrement #292 PR-T3; do tego
      czasu kanał jest raportowany, ale nie asertowany (żadnego fałszywego PASS).
