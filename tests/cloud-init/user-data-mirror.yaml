#cloud-config
# Laboratorium testowe dla wariantu z kuratorowanym mirrorem pakietów (#288 klasa 4, IMG-004/#16).
# Egress badacza tylko do testowego proxy z allowlistą (tests/proxy_sink.py na 10.0.2.2:3128).
hostname: lab-test01
fqdn: lab-test01.wlb.local

users:
  - name: wlbadmin
    uid: 1001
    groups: [sudo, wlb-platform-admins]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBKEY__
ssh_pwauth: false

disk_setup:
  /dev/vdb:
    table_type: gpt
    layout: true
    overwrite: false
fs_setup:
  - label: workspace
    filesystem: ext4
    device: /dev/vdb
    partition: auto
mounts:
  - [LABEL=workspace, /workspace, ext4, "defaults,nodev,nosuid", "0", "2"]

write_files:
  - path: /etc/wlb/lab.env
    permissions: "0600"
    content: |
      LAB_NAME=lab-test01
      HUB_ADMIN_USER=a01
      RESEARCHER_ACCOUNTS=2
      # instalacja pakietów przez badacza: kuratorowany mirror (#16, IMG-004)
      RESEARCHER_PACKAGE_INSTALL=mirror
      PYPI_INDEX_URL=https://pypi.mirror.local/simple
      CRAN_MIRROR_URL=https://cran.mirror.local
      PROXY_URL=http://10.0.2.2:3128
      EGRESS_ALLOW="10.0.2.2:3128"
      ADMIN_SSH_CIDR=10.0.2.0/24
      HUB_ALLOWED_CIDR=10.0.2.0/24
      # TLS huba (#18) — domyślna ścieżka produkcyjna.
      HUB_TLS=1
      HUB_TLS_CERT=/etc/wlb/hub-tls.crt
      HUB_TLS_KEY=/etc/wlb/hub-tls.key
      NTP_SERVERS=10.0.2.2
      SIEM_HOST=10.0.2.2
      SIEM_PORT=5514
      SIEM_PROTOCOL=tcp
      SIEM_TLS_NAME=siem.test.local
      LOCAL_TEST_MODE=1
      RESEARCHER_TASKS_MAX=256
      RESEARCHERS_PER_VM=2
  - path: /etc/wlb/siem-ca.pem
    permissions: "0644"
    encoding: b64
    content: __SIEM_CA_B64__
  - path: /etc/wlb/hub-tls.crt
    permissions: "0644"
    encoding: b64
    content: __HUB_CERT_B64__
  - path: /etc/wlb/hub-tls.key
    permissions: "0600"
    encoding: b64
    content: __HUB_KEY_B64__
  - path: /etc/wlb/hub-ca.pem
    permissions: "0644"
    encoding: b64
    content: __HUB_CA_B64__

runcmd:
  - [/usr/local/sbin/wlb-firstboot]
