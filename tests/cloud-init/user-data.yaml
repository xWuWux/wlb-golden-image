#cloud-config
# Laboratorium testowe dla lokalnego uruchomienia obrazu (tests/run-local.sh).
# Bez udziałów sieciowych. Egress badacza tylko do testowego proxy z allowlistą (tests/proxy_sink.py
# na 10.0.2.2:3128, #16): połączenia bezpośrednie (poza zaporą) i do hostów spoza allowlisty muszą się
# nie udać; proxy przepuszcza tylko mirrory, a odrzuca resztę (w tym API LLM, §31.3).
hostname: lab-test01
fqdn: lab-test01.wlb.local

users:
  - name: wlbadmin
    uid: 1001
    groups: [sudo, wlb-platform-admins]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - __SSH_PUBKEY__
ssh_pwauth: false

disk_setup:
  /dev/vdb:
    table_type: gpt
    layout: true
    overwrite: false
fs_setup:
  - label: workspace
    filesystem: ext4
    device: /dev/vdb
    partition: auto
mounts:
  - [LABEL=workspace, /workspace, ext4, "defaults,nodev,nosuid", "0", "2"]

write_files:
  - path: /etc/wlb/lab.env
    permissions: "0600"
    content: |
      LAB_NAME=lab-test01
      HUB_ADMIN_USER=a01
      RESEARCHER_ACCOUNTS=2
      # instalacja pakietów przez badacza: zakaz (§24.c, IMG-004); kuratorowany mirror (#16)
      # włączyłby tryb mirror razem z PYPI_INDEX_URL/CRAN_MIRROR_URL
      RESEARCHER_PACKAGE_INSTALL=deny
      PROXY_URL=http://10.0.2.2:3128
      EGRESS_ALLOW="10.0.2.2:3128"
      ADMIN_SSH_CIDR=10.0.2.0/24
      HUB_ALLOWED_CIDR=10.0.2.0/24
      # TLS huba (#18) — domyślna ścieżka produkcyjna. Cert/klucz z write_files (testowe PKI, wspólna CA).
      # Akceptacja łączy się po HTTPS (HUB=https://localhost) i weryfikuje CA + nazwę, bez -k (remote-common.sh).
      HUB_TLS=1
      HUB_TLS_CERT=/etc/wlb/hub-tls.crt
      HUB_TLS_KEY=/etc/wlb/hub-tls.key
      # host QEMU (sieć user) — testowy serwer czasu (tests/ntp_sink.py) odpowiada na 10.0.2.2:123,
      # a etap 5 sprawdza faktyczną synchronizację (chronyc waitsync + stratum), nie tylko konfigurację (#36)
      NTP_SERVERS=10.0.2.2
      # testowy odbiornik SIEM na hoście (tests/syslog_sink.py, tylko TLS); bez niego rsyslog kolejkuje logi.
      # Połączenie na adres IP, weryfikacja nazwy z certyfikatu (tests/lib/test-pki.sh) — jak w produkcji
      SIEM_HOST=10.0.2.2
      SIEM_PORT=5514
      SIEM_PROTOCOL=tcp
      SIEM_TLS_NAME=siem.test.local
      LOCAL_TEST_MODE=1
      # niski limit procesów, żeby test fork bomb w VM był krótki i lekki (#30)
      RESEARCHER_TASKS_MAX=256
      # w teście dwóch badaczy (tester1, tester2) na jednej VM — wariant C z IMG-001
      RESEARCHERS_PER_VM=2
  - path: /etc/wlb/siem-ca.pem
    permissions: "0644"
    encoding: b64
    content: __SIEM_CA_B64__
  # TLS huba (#18): cert serwera (SAN localhost/127.0.0.1), klucz prywatny (0600) i CA do zaufania
  # przez curl w akceptacji (CURL_CA_BUNDLE w remote-common.sh) — weryfikacja bez -k.
  - path: /etc/wlb/hub-tls.crt
    permissions: "0644"
    encoding: b64
    content: __HUB_CERT_B64__
  - path: /etc/wlb/hub-tls.key
    permissions: "0600"
    encoding: b64
    content: __HUB_KEY_B64__
  - path: /etc/wlb/hub-ca.pem
    permissions: "0644"
    encoding: b64
    content: __HUB_CA_B64__

runcmd:
  - [/usr/local/sbin/wlb-firstboot]
