version: 2
updates:
  # cooldown: nowe wydania proponowane po 7 dniach — ochrona przed złośliwymi/wycofanymi wersjami
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      ci-tools:
        patterns: ["*"]
