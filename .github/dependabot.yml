version: 2
updates:
  # cooldown: nowe wydania proponowane po 7 dniach — ochrona przed złośliwymi/wycofanymi wersjami
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Piny top-level w ci/requirements-*.in; zahashowane locki ci/requirements-*.txt generuje
  # ci/lock-requirements.sh i instaluje je CI z --require-hashes (IMG-008 5b). Po bumpie, który
  # zmienia domknięcie zależności, lock trzeba zregenerować skryptem; niespójny lock padnie w CI
  # na --require-hashes (fail-closed), nie przejdzie po cichu.
  - package-ecosystem: pip
    directory: /ci
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # wlb-hub-user jest testowany na tej samej wersji JupyterHub co w obrazie (TLJH 2.0.0 -> 5.x);
      # nowa główna wersja wchodzi razem ze zmianą wersji TLJH w obrazie, nie osobno w CI
      - dependency-name: jupyterhub
        update-types: ["version-update:semver-major"]
    groups:
      ci-tools:
        patterns: ["*"]
