# Wydanie obrazu z tagu vX.Y.Z (#12a): buduje obraz i etap 5 na otagowanym commicie, składa
# pakiet metadanych (proweniencja, SBOM SPDX, changelog, SHA256SUMS) i publikuje GitHub Release.
# Sam qcow2 (4,3 GB > limit 2 GiB GitHuba) i jego przechowywanie to #12b (zależne od #15).
# Tag tnij z zielonego `main` — build+etap 5 i tak zweryfikują obraz, a wydanie powstaje tylko po sukcesie.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools
  PYTHON_VERSION: "3.12"
  LIBGUESTFS_BACKEND: direct # bramka E2E czyta qcow2 przez virt-ls; direct nie wymaga libvirtd

jobs:
  release:
    name: "Wydanie obrazu (tag)"
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    permissions:
      contents: write # tworzenie GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tagi i pełna historia do git describe i changelogu
      - name: Wersja obrazu z tagu
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >>"$GITHUB_OUTPUT"
      - name: Miejsce na dysku (obraz + VM testowe)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Dostęp do KVM
        run: ci/enable-kvm.sh
      - name: QEMU i narzędzia obrazu
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils genisoimage libguestfs-tools
      - name: Sprawdź libguestfs (bramka E2E czyta qcow2 przez virt-ls)
        run: libguestfs-test-tool >/dev/null
      # Bramka E2E jest runtime'owa, więc mocki jednostkowe nie wystarczą (#360).
      # Przed 150-minutowym buildem dowodzimy, że virt-ls czyta qcow2: czysty obraz
      # przechodzi (0), a obraz z fixture E2E jest odrzucany (3).
      - name: Smoke-test bramki E2E na małym qcow2
        run: |
          root=$(mktemp -d)
          mkdir -p "$root"/{etc,usr/lib,usr/bin,usr/share/applications,bin,sbin,lib,lib64,var/lib,tmp,root,home,run,proc,sys,dev,boot,opt/wlb/bin}
          printf 'ID=ubuntu\nVERSION_ID="24.04"\nVERSION_CODENAME=noble\n' >"$root/etc/os-release"
          cp "$root/etc/os-release" "$root/usr/lib/os-release"
          printf 'proc /proc proc defaults 0 0\n' >"$root/etc/fstab"
          printf 'root:x:0:0:root:/root:/bin/sh\n' >"$root/etc/passwd"
          printf 'root:x:0:\n' >"$root/etc/group"
          printf '#!/bin/sh\nexit 0\n' >"$root/opt/wlb/bin/wlb-health"
          virt-make-fs --format=qcow2 --type=ext4 "$root" /tmp/e2e-clean.qcow2
          python3 ci/e2e_release_gate.py --image /tmp/e2e-clean.qcow2
          mkdir -p "$root/opt/wlb/e2e"
          printf '{}\n' >"$root/opt/wlb/e2e/target.json"
          virt-make-fs --format=qcow2 --type=ext4 "$root" /tmp/e2e-dirty.qcow2
          rc=0
          python3 ci/e2e_release_gate.py --image /tmp/e2e-dirty.qcow2 || rc=$?
          [[ $rc -eq 3 ]] || { echo "Bramka nie odrzuciła obrazu z E2E (rc=$rc)" >&2; exit 1; }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: ci/install-tools.sh lint security
      - name: Budowanie obrazu i etap 5 na otagowanym commicie
        run: |
          ci/guard.sh --name "Wydanie: budowanie i etap 5" --timeout 150m --memory auto -- ci/integration.sh
        env:
          IMAGE_VERSION: ${{ steps.ver.outputs.version }}
      - name: Złóż pakiet wydania (metadane, SBOM, changelog, SHA256SUMS)
        run: ci/release.sh "${GITHUB_REF_NAME}"
      - name: Opublikuj GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file build/release/CHANGELOG.md \
            build/release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-${{ github.ref_name }}
          path: build/release/
          if-no-files-found: ignore
          retention-days: 90
