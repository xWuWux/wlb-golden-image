# Ustalona ścieżka dla awarii infrastruktury: jeśli przebieg CI padł WYŁĄCZNIE z powodu runnera
# ("The operation was canceled", utrata runnera — kategoria infra w ci/ci_failures.py), nieudane joby
# są ponawiane automatycznie jeden raz. Błędy testów, OOM i przekroczenia czasu nie są ponawiane —
# wymagają poprawki (docs/ci-runbook.md). Przebiegi nieaktualnych commitów też nie.
#
# Uwaga: workflow_run działa tylko z wersji pliku na gałęzi domyślnej (main).
name: CI retry

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  retry:
    name: Ponowienie po awarii infrastruktury
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # rerun-failed-jobs
      checks: read
      contents: read
    steps:
      # kod z gałęzi domyślnej — workflow tylko czyta API i zleca ponowienie, nie wykonuje kodu z PR
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 ci/ci_failures.py retry --repo "$REPO" --run-id "$RUN_ID"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
