# Pipeline golden image WLB. Etapy w kolejności: każdy startuje dopiero po sukcesie poprzedniego.
#   1. Lint, format i skan sekretów       ci/lint.sh
#   2. Build test                          ci/build-check.sh
#   3. Security & compliance               ci/security.sh
#   3r. Publikacja Code scanning           SARIF semgrep/checkov z etapu 3 -> GitHub (raport, nie bramka
#                                          podatności; jedyny job z security-events: write, #257)
#   3.5 Kontrakty obrazu                  ci/observability.sh  (zdarzenia VM i zmienne wdrożenia
#                                          zgodne z kodem)
#   4. Testy jednostkowe + progi pokrycia  ci/unit.sh
#   4b. Testy mutacyjne (bramkujące)       ci/mutation.sh — mutmut + tabela mutacji powłoki
#   4d. Modele wydania i decyzji eksportowej              make formal-logic (zmiany kontraktu, harmonogram i uruchomienie ręczne)
#   5. Integracja i migracja (KVM)         ci/integration.sh    — NIE na każdym PR (koszt, #86):
#                                          PR sieci/utwardzenia, push main, etykieta lub ręcznie;
#                                          także: czy zdarzenia z kontraktu docierają do SIEM
#   6. Benchmarki / wdrożenie tymczasowe   ci/perf.sh, ci/ephemeral-openstack.sh — na żądanie
#   => "Gotowe do code review" (wymagany status check dla main; etap 5 wymagany tylko gdy image=true)
# Logika jest w skryptach ci/*.sh — działa tak samo lokalnie (make ci) i łatwo ją przenieść do GitLab CI.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # poniedziałki: etapy 1–4 (nowe CVE w zamrożonych wersjach, zmiany licencji)
    # Nocny pełny build: start ostrożnie — raz w tygodniu (wtorki 03:00 UTC, #288).
    # Przy zmianie ustaw TEN SAM cron tutaj i w NIGHTLY_CRON w ci/changes.sh (muszą być identyczne).
    - cron: "0 3 * * 2" # wt. nocny pełny build: etapy 1–6 niezależnie od zmian (dryf, CVE, e2e)
  workflow_dispatch:
    inputs:
      perf:
        description: "Stage 6a: benchmarki wydajności"
        type: boolean
        default: false
      perf_repeat:
        description: "Stage 6a: liczba powtórzeń pomiarów w VM (kalibracja, #10)"
        type: string
        default: "3"
      ephemeral:
        description: "Stage 6b: wdrożenie tymczasowe na OpenStack"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TOOLS_DIR: ${{ github.workspace }}/.tools
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: "1. Lint, format i sekrety"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      formal: ${{ steps.changes.outputs.formal }}
      image: ${{ steps.changes.outputs.image }}
      radiologia: ${{ steps.changes.outputs.radiologia }}
      memory: ${{ steps.changes.outputs.memory }}
      histologia: ${{ steps.changes.outputs.histologia }}
      flavors: ${{ steps.changes.outputs.flavors }}
      perf: ${{ steps.changes.outputs.perf }}
      ephemeral: ${{ steps.changes.outputs.ephemeral }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks skanuje całą historię
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-lint-${{ runner.os }}-${{ hashFiles('ci/install-tools.sh', 'ci/requirements-lint.txt') }}
      - run: ci/install-tools.sh lint
      - run: ci/guard.sh --name "1. Lint" --timeout 10m --memory auto -- ci/lint.sh
      - name: Które etapy 5–6 uruchomić
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          IN_PERF: ${{ inputs.perf }}
          IN_EPHEMERAL: ${{ inputs.ephemeral }}
          SCHEDULE: ${{ github.event.schedule }}
        run: ci/changes.sh | tee -a "$GITHUB_OUTPUT"

  formal-logic:
    name: "4d. Modele wydania i decyzji eksportowej"
    needs: lint
    if: needs.lint.outputs.formal != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pobierz przypięty Lean dla Linux x86_64
        working-directory: formal
        run: |
          version=$(sed -n 's/^leanprover\/lean4:v//p' lean-toolchain)
          archive="$RUNNER_TEMP/lean-linux.tar.zst"
          curl --fail --location --silent --show-error --retry 2 -o "$archive" \
            "https://github.com/leanprover/lean4/releases/download/v$version/lean-$version-linux.tar.zst"
          echo "6fe3ce97a58f44e2b3567d455b994eacec5bfe9ae7774f2a573444480ba813fe  $archive" | sha256sum --check
          tar --zstd -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-$version-linux/bin" >>"$GITHUB_PATH"
      - run: make formal-logic

  build-check:
    name: "2. Build test"
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-lint-${{ runner.os }}-${{ hashFiles('ci/install-tools.sh', 'ci/requirements-lint.txt') }}
      - name: Walidatory systemowe (cloud-init, R, nftables, rsyslog)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends cloud-init r-base-core nftables rsyslog
      - run: ci/install-tools.sh lint
      - run: ci/guard.sh --name "2. Build test" --timeout 15m --memory auto -- ci/build-check.sh

  security:
    name: "3. Security & compliance"
    needs: build-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Job wykonuje kod z PR i instaluje narzędzia — zostaje tylko do odczytu (dziedziczy contents: read).
    # Publikację SARIF robi osobny job security-report (#257).
    outputs:
      semgrep: ${{ steps.sarif.outputs.semgrep }}
      checkov: ${{ steps.sarif.outputs.checkov }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-security-${{ runner.os }}-${{ hashFiles('ci/install-tools.sh', 'ci/requirements-security.txt') }}
      - run: ci/install-tools.sh security
      - run: ci/guard.sh --name "3. Security" --timeout 25m --memory auto -- ci/security.sh
      # Także po znaleziskach (krok wyżej czerwony): wynik skanera (clean/findings/error/not_run),
      # walidacja SARIF i usunięcie fragmentów kodu (snippetów), które mogłyby przenieść sekret.
      - name: Raporty SARIF dla Code scanning (#257)
        id: sarif
        if: ${{ !cancelled() }}
        # pod strażnikiem (limit czasu i pamięci) jak skany — transformacja niezaufanego raportu z PR
        run: >-
          ci/guard.sh --name "3. Raporty SARIF" --timeout 5m --memory auto --
          python3 ci/sarif_report.py prepare --sca-dir build/sca --out-dir build/code-scanning
      # Surowe SARIF (snippety, komunikaty narzędzia z fragmentami kodu, ew. wykryty sekret) nie opuszczają
      # runnera: repo jest publiczne, a artefakty może pobrać każdy zalogowany użytkownik. Publikowane są
      # tylko raporty po eksporcie z allowlisty pól (artefakt code-scanning-sarif), #257.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-reports
          path: |
            build/sca/
            !build/sca/**/*.sarif
          if-no-files-found: ignore
          retention-days: 30
      # Tylko dwa jawne raporty i manifest (nie całe build/sca) — wejście joba security-report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.sarif.outcome == 'success' }}
        with:
          name: code-scanning-sarif
          path: |
            build/code-scanning/semgrep.sarif
            build/code-scanning/checkov.sarif
            build/code-scanning/manifest.json
          if-no-files-found: error
          retention-days: 30

  # Publikacja wyników etapu 3 w GitHub Code scanning (#257). Polityka: RAPORT, nie druga bramka —
  # znaleziska blokuje wyłącznie ci/security.sh (job security). Ten job odpowiada tylko za dostarczenie
  # raportów; jego niepowodzenie (brak/niepoprawny raport, błąd uploadu) blokuje "Gotowe do code review"
  # jako kontrola infrastrukturalna. Konteksty bez publikacji (merge queue, Dependabot poza PR) są nazwane w kroku
  # "Kontekst publikacji" i kończą się stanem unsupported. Szczegóły: docs/ci-runbook.md#code-scanning.
  # Uprawnienie zapisu jest TYLKO tutaj: job nie uruchamia skryptów z repo, lokalnych actions ani
  # instalacji; checkout służy wyłącznie mapowaniu ścieżek i fingerprintów.
  security-report:
    name: "3r. Publikacja Code scanning"
    needs: security
    # także po znaleziskach (security = failure); anulowanie i pominięcie etapu 3 to osobne stany
    if: ${{ !cancelled() && (needs.security.result == 'success' || needs.security.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # pobranie artefaktu i metadane przebiegu dla upload-sarif
      contents: read
      security-events: write # upload-sarif — wyłącznie w tym jobie
    steps:
      - name: Kontekst publikacji
        id: context
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          HEAD_AUTHOR: ${{ github.event.head_commit.author.username }}
        run: |
          # SHA/ref analizy pochodzą z kontekstu przebiegu (domyślne wejścia upload-sarif), nigdy z raportu.
          # pull_request (także fork i Dependabot): code scanning przyjmuje upload mimo tokena tylko do
          # odczytu — docs.github.com: troubleshoot-analysis-errors/resource-not-accessible.
          supported=true reason=""
          if [[ $EVENT == merge_group ]]; then
            supported=false
            reason="merge queue: ref kolejki znika, a analiza nie jest wynikiem main (publikują PR i push do main)"
          elif [[ $EVENT != pull_request && ($ACTOR == "dependabot[bot]" || $HEAD_AUTHOR == "dependabot[bot]") ]]; then
            # także squash-merge PR Dependabota: commit jego autorstwa dostaje token tylko do odczytu
            supported=false
            reason="przebieg Dependabota (lub jego commitu) poza pull_request: token tylko do odczytu"
          fi
          echo "supported=$supported" >>"$GITHUB_OUTPUT"
          echo "reason=$reason" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.context.outputs.supported == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.context.outputs.supported == 'true'
        with:
          name: code-scanning-sarif
          path: ${{ runner.temp }}/code-scanning
      # raporty muszą pochodzić z tego przebiegu i tej rewizji (manifest joba 3), nie z innego runu
      # Spójność, nie dowód zaufania: raport wytworzył kod z PR. run_attempt nie jest porównywany, bo
      # „Re-run failed jobs” poprawnie publikuje artefakt z wcześniejszej próby tego samego przebiegu.
      - name: Weryfikacja manifestu
        id: manifest
        if: steps.context.outputs.supported == 'true'
        env:
          DIR: ${{ runner.temp }}/code-scanning
        run: |
          manifest=$DIR/manifest.json
          run_sha=$(jq -r '.run.sha // ""' "$manifest" 2>/dev/null || true)
          run_id=$(jq -r '.run.run_id // ""' "$manifest" 2>/dev/null || true)
          if [[ $run_sha != "$GITHUB_SHA" || $run_id != "$GITHUB_RUN_ID" ]]; then
            echo "::error::manifest raportów nie pasuje do przebiegu (sha=${run_sha:-brak}, run_id=${run_id:-brak})"
            exit 1
          fi
          # każdy raport do publikacji ma dokładnie ten skrót, który zapisał job 3
          for tool in semgrep checkov; do
            publish=$(jq -r --arg t "$tool" '.reports[] | select(.tool == $t) | .publish' "$manifest")
            [[ $publish == true ]] || continue
            want=$(jq -r --arg t "$tool" '.reports[] | select(.tool == $t) | .sha256 // ""' "$manifest")
            have=$(sha256sum "$DIR/$tool.sarif" 2>/dev/null) || have=""
            if [[ -z $want || ${have%% *} != "$want" ]]; then
              echo "::error::skrót raportu $tool nie zgadza się z manifestem"
              exit 1
            fi
          done
      - name: Upload SARIF semgrep
        id: semgrep
        if: >-
          ${{ !cancelled() && steps.context.outputs.supported == 'true' && steps.manifest.outcome == 'success' &&
          (needs.security.outputs.semgrep == 'clean' || needs.security.outputs.semgrep == 'findings') }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/code-scanning/semgrep.sarif
          category: semgrep
          checkout_path: ${{ github.workspace }}
          wait-for-processing: true
      # !cancelled(): próba publikacji checkov także po nieudanym uploadzie semgrep
      - name: Upload SARIF checkov
        id: checkov
        if: >-
          ${{ !cancelled() && steps.context.outputs.supported == 'true' && steps.manifest.outcome == 'success' &&
          (needs.security.outputs.checkov == 'clean' || needs.security.outputs.checkov == 'findings') }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: ${{ runner.temp }}/code-scanning/checkov.sarif
          category: checkov
          checkout_path: ${{ github.workspace }}
          wait-for-processing: true
      # upload-sarif po przekroczeniu własnego limitu oczekiwania tylko ostrzega i kończy się sukcesem,
      # więc „processed” potwierdzamy osobno: terminalny status konkretnego sarif-id (complete).
      # pending po terminie to błąd kontroli infrastrukturalnej, nie zielony wynik.
      - name: Potwierdzenie przetworzenia
        id: confirm
        if: ${{ !cancelled() && steps.context.outputs.supported == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SEMGREP_ID: ${{ steps.semgrep.outputs.sarif-id }}
          CHECKOV_ID: ${{ steps.checkov.outputs.sarif-id }}
          CONFIRM_TIMEOUT: "300"
          CONFIRM_INTERVAL: "10"
        run: |
          # status konkretnego sarif-id; kody HTTP rozdzielone: brak uprawnień (np. fork) nie jest complete
          body=$(mktemp)
          for tool in semgrep checkov; do
            id_var=${tool^^}_ID
            id=${!id_var:-}
            status=none
            if [[ -n $id ]]; then
              deadline=$((SECONDS + CONFIRM_TIMEOUT))
              while :; do
                http=$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$REPO/code-scanning/sarifs/$id") || http=000
                case $http in
                  200)
                    status=$(jq -r '.processing_status // "unknown"' "$body" 2>/dev/null) || status=unknown
                    [[ -n $status ]] || status=unknown
                    ;;
                  401 | 403) status=forbidden ;;
                  404) status=not_found ;;
                  429 | 5?? | 000) status=unavailable ;;
                  *) status=http_$http ;;
                esac
                # do terminu ponawiamy tylko stany przejściowe; pozostałe są ostateczne
                case $status in
                  pending | unknown | not_found | unavailable) ((SECONDS < deadline)) || break ;;
                  *) break ;;
                esac
                sleep "$CONFIRM_INTERVAL"
              done
            fi
            echo "$tool: sarif-id=${id:-brak} status=$status"
            echo "$tool=$status" >>"$GITHUB_OUTPUT"
          done
      - name: Stan publikacji
        id: state
        if: always()
        env:
          SUPPORTED: ${{ steps.context.outputs.supported }}
          REASON: ${{ steps.context.outputs.reason }}
          SEMGREP_SCAN: ${{ needs.security.outputs.semgrep }}
          SEMGREP_UPLOAD: ${{ steps.semgrep.outcome }}
          CHECKOV_SCAN: ${{ needs.security.outputs.checkov }}
          CHECKOV_UPLOAD: ${{ steps.checkov.outcome }}
          SEMGREP_CONFIRM: ${{ steps.confirm.outputs.semgrep }}
          CHECKOV_CONFIRM: ${{ steps.confirm.outputs.checkov }}
        run: |
          # PublicationState: processed / failed / unsupported / cancelled (docs/ci-runbook.md#code-scanning)
          failed=0
          {
            echo "### Publikacja Code scanning (#257)"
            echo
            echo "| Narzędzie | Wynik skanu | Publikacja |"
            echo "|---|---|---|"
          } >>"$GITHUB_STEP_SUMMARY"
          for tool in semgrep checkov; do
            scan_var=${tool^^}_SCAN upload_var=${tool^^}_UPLOAD confirm_var=${tool^^}_CONFIRM
            scan=${!scan_var:-not_run} upload=${!upload_var:-skipped} confirm=${!confirm_var:-none}
            if [[ $SUPPORTED != true ]]; then
              state="unsupported — ${REASON:-nieznany kontekst}"
              [[ -n $REASON ]] || failed=1
            elif [[ $scan != clean && $scan != findings ]]; then
              state="failed — brak poprawnego raportu ($scan); to błąd analizy, nie czysty wynik"
              failed=1
            else
              case $upload in
                success)
                  # processed = GitHub potwierdził terminalny status complete dla tego sarif-id
                  if [[ $confirm == complete ]]; then
                    state=processed
                  elif [[ $confirm == pending ]]; then
                    state="pending — brak terminalnego statusu przetwarzania w terminie"
                    failed=1
                  else
                    state="failed — przetwarzanie niepotwierdzone (status: $confirm)"
                    failed=1
                  fi
                  ;;
                cancelled) state=cancelled; failed=1 ;;
                *) state="failed — upload/przetwarzanie: $upload"; failed=1 ;;
              esac
            fi
            echo "| $tool | $scan | $state |" >>"$GITHUB_STEP_SUMMARY"
            echo "$tool: skan=$scan publikacja=$state"
          done
          exit "$failed"

  observability:
    name: "3.5. Kontrakty obrazu"
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # + menedżer Wazuh w kontenerze (#17)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-lint-${{ runner.os }}-${{ hashFiles('ci/install-tools.sh', 'ci/requirements-lint.txt') }}
      - run: ci/install-tools.sh lint
      - run: ci/guard.sh --name "3.5. Kontrakty obrazu" --timeout 15m --memory auto -- ci/observability.sh

  unit:
    name: "4. Testy jednostkowe + pokrycie"
    needs: observability
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # kcov (pokrycie skryptów powłoki) jest w Ubuntu od 26.04 — ten sam system co stacje deweloperskie
    container: ubuntu:26.04
    env:
      CI: "true"
    steps:
      - name: Zależności testów
        # sqlite3: testy DR huba (#306); bez niego bats skipują, a etap 4b traktuje skip jako błąd.
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            ca-certificates curl git jq kcov psmisc python3 python3-venv sqlite3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/install-tools.sh unit
      - run: ci/guard.sh --name "4. Testy jednostkowe" --timeout 15m --memory auto -- ci/unit.sh
      - name: "Zbieranie wyników testów (flaky telemetria, #349)"
        if: always()
        run: >-
          python3 ci/flaky_report.py collect --reports build/test-reports
          --out build/ci-logs/flaky.json --job "4. Testy jednostkowe + pokrycie"
          --commit "${{ github.sha }}" --run-id "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
      # Wyniki per-test z zachowaniem prób (run_attempt) — podstawa metryk niestabilności (#349 Phase 1)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-${{ github.run_attempt }}
          path: build/ci-logs/flaky.json
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: build/test-reports/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: build/coverage/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: "4b. Testy mutacyjne"
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: ubuntu:26.04
    env:
      CI: "true"
    steps:
      - name: Zależności testów
        # sqlite3: testy DR huba (#306); bez niego bats skipują, a baseline mutacji jest wtedy błędem.
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            ca-certificates curl git jq psmisc python3 python3-venv sqlite3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/install-tools.sh unit
      - run: ci/guard.sh --name "4b. Testy mutacyjne" --timeout 20m --memory auto -- ci/mutation.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation
          path: build/mutation/
          if-no-files-found: ignore
          retention-days: 14

  flaky-detect:
    name: "4c. Detekcja niestabilności (kolejność)"
    # Lane NIEBRAMKUJĄCY (#349): POZA needs bramki „ready" + continue-on-error → czerwień nigdy nie
    # blokuje merge. Opt-in: nocny pełny build (wt.), ręcznie (workflow_dispatch) lub etykieta PR
    # „flaky-detect". pytest-randomly tasuje kolejność — wykrywa zależność od kolejności (Gruber ICST
    # 2021: dominująca przyczyna flaky w Pythonie), niewidoczną dla ponawiania w tej samej kolejności.
    needs: lint
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 2') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'flaky-detect'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: ubuntu:26.04
    continue-on-error: true
    env:
      CI: "true"
    steps:
      - name: Zależności testów
        # sqlite3: testy DR huba (#306); te same zależności co etap 4, by detekcja biegła w tym środowisku.
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            ca-certificates curl git jq psmisc python3 python3-venv sqlite3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ci/install-tools.sh flaky
      - name: "Detekcja niestabilności przez losową kolejność"
        # venv-flaky ma pytest-randomly; .tools na PATH dla testów wołających bats/narzędzia.
        run: |
          export PATH="$PWD/.tools/bin:$PWD/.tools/bats/bin:$PATH"
          .tools/venv-flaky/bin/python ci/flaky_detect.py --target tests/unit --runs 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: flaky-detect-${{ github.run_attempt }}
          path: |
            build/ci-logs/flaky-detect.json
            build/test-reports/flaky-detect/
          if-no-files-found: ignore
          retention-days: 90

  build-base:
    name: "5a. Budowa bazy"
    needs: [lint, unit]
    if: needs.lint.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      image_date: ${{ steps.imgdate.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Miejsce na dysku
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            /usr/lib/google-cloud-sdk /opt/microsoft /usr/local/graalvm 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - name: Dostęp do KVM
        run: ci/enable-kvm.sh
      - name: QEMU i narzędzia obrazu
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils genisoimage
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-security-${{ runner.os }}-${{ hashFiles('ci/install-tools.sh', 'ci/requirements-security.txt') }}
      - run: ci/install-tools.sh lint security
      - id: imgdate
        # IMAGE_DATE wyliczone RAZ i wystawione jako output joba — matrix integracji (i 6a/6b) MUSZĄ
        # użyć tej samej daty, inaczej $FULL (wlb-general-<ver>-<data>) rozjeżdża się między jobami,
        # obraz z cache nie pasuje do REUSE_IMAGE i wariant pada/odbudowuje się po cichu (regresja #288).
        run: echo "date=$(date +%Y%m%d)" >>"$GITHUB_OUTPUT"
      - run: ci/guard.sh --name "5a. Budowa bazy" --timeout 70m --memory auto -- ci/integration.sh build-base
        env:
          IMAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
          IMAGE_DATE: ${{ steps.imgdate.outputs.date }}
      # obraz bazowy dla matrixa integracji i etapów 6a/6b (#288 klasa 4).
      # Artefakt zamiast cache: 5+ GB obraz przekraczał eksmisyjny cache Actions (repo-cap 10 GB),
      # więc matrix dostawał fałszywy cache-miss MIMO udanego 'Cache saved' w 5a (#317). Artefakt
      # przeżywa cały bieg bez eksmisji; upload-artifact dodatkowo kompresuje (zip).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.run_id }}
          path: output/
          if-no-files-found: error
          retention-days: 1
      # Locki i metadane z budowania (renv.lock, environment.lock.yml) — test dryfu i SBOM w jobach
      # integracji czytają build/artifacts; cache obrazu przenosi tylko output/ (#317).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 7

  integration:
    name: "5. Integracja (${{ matrix.flavor }})"
    needs: [lint, unit, build-base]
    if: needs.lint.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Dynamiczna lista: tylko flavory, które realnie się zbudują (general zawsze gdy image=true,
        # reszta przy opt-in). Nieopt-inowy flavor nie jest jobem zamiast przechodzić na pusto (#317/P1-5).
        flavor: ${{ fromJSON(needs.lint.outputs.flavors) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Miejsce na dysku (obraz + VM testowe)
        run: |
          # Flavor wlb-memory (LibreOffice) + baza + konwersje qemu-img przepełniały / runnera
          # ("No space left" po ~22 GB, #203). Agresywniej zwalniamy preinstal runnera.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            /usr/lib/google-cloud-sdk /opt/microsoft /usr/local/graalvm 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          df -h /
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.run_id }}
          path: output
      # Te same locki z budowania, co w jobie 5a — bez nich lock_drift widzi pusty build/artifacts
      # i zgłasza fałszywy dryf (FileNotFoundError renv.lock, #317).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: build/artifacts
      - name: Dostęp do KVM
        run: ci/enable-kvm.sh
      - name: QEMU i narzędzia obrazu
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils genisoimage
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Playwright + Chromium (E2E #206) są w warstwie testowej; cache skraca etap 5 o ~1–2 min.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/venv-e2e
            ~/.cache/ms-playwright
          key: tools-e2e-${{ runner.os }}-${{ hashFiles('ci/install-tools.sh', 'ci/requirements-e2e.txt') }}
      - run: ci/install-tools.sh lint security e2e
      - run: ci/guard.sh --name "5. Integracja (${{ matrix.flavor }})" --timeout 150m --memory auto -- ci/integration.sh
        env:
          IMAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
          IMAGE_DATE: ${{ needs.build-base.outputs.image_date }}
          REUSE_IMAGE: "1"
          WLB_FLAVOR: ${{ matrix.flavor }}
          # Flavor wlb-radiologia budowany+testowany tylko na żądanie (etykieta build-radiologia / zmiana
          # plików flavora / nocny build) — opt-in, bez kosztu na każdym PR (#135).
          WLB_BUILD_RADIOLOGIA: ${{ needs.lint.outputs.radiologia == 'true' && '1' || '0' }}
          # Flavor wlb-memory analogicznie opt-in (etykieta build-memory / zmiana plików flavora / nocny
          # build) — pulpit + LibreOffice Calc testowane na realnym obrazie (#105).
          WLB_BUILD_MEMORY: ${{ needs.lint.outputs.memory == 'true' && '1' || '0' }}
          # Flavor wlb-histologia analogicznie opt-in (etykieta build-histologia / zmiana plików flavora /
          # nocny build) — pulpit + Calc + RStudio + jamovi-Flatpak na realnym obrazie (#108).
          WLB_BUILD_HISTOLOGIA: ${{ needs.lint.outputs.histologia == 'true' && '1' || '0' }}
          # Bramka regresji Lynis (#288): domyślnie raport; vars.WLB_LYNIS_GATING=1 promuje,
          # vars.WLB_LYNIS_BASELINE nadpisuje baseline (domyślnie 72).
          WLB_LYNIS_GATING: ${{ vars.WLB_LYNIS_GATING || '0' }}
          WLB_LYNIS_BASELINE: ${{ vars.WLB_LYNIS_BASELINE || '72' }}
          # Bramka kanałów eksportu/importu (#292): domyślnie RAPORT (jak #138 — do walidacji KVM).
          # vars.WLB_CHANNEL_GATING=1 promuje niezgodności `required` oraz awarie wymaganych sond do
          # blokującego FAIL. Bez tej linii flaga była martwa (harness ma logikę, ale CI jej nie podawało).
          WLB_CHANNEL_GATING: ${{ vars.WLB_CHANNEL_GATING || '0' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-logs-${{ matrix.flavor }}
          path: |
            build/ci-logs/
            build/artifacts/
            build/sca/
            output/*/*.sha256
            output/*/packer-manifest.json
          if-no-files-found: ignore
          retention-days: 30
      # osobny krok z limitem czasu: wcześniej przebieg przerywał się w tym miejscu
      # i nie zostawały żadne artefakty
      - name: Podatności pakietów w obrazie (raport)
        if: matrix.flavor == 'general'
        continue-on-error: true
        timeout-minutes: 15
        run: ci/integration.sh image-sca
        env:
          IMAGE_VERSION: 0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.flavor == 'general'
        with:
          name: image-sca
          path: build/sca/
          if-no-files-found: ignore
          retention-days: 30

  perf:
    name: "6a. Benchmarki wydajności"
    needs: [lint, integration]
    if: needs.lint.outputs.perf == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # etykieta/nightly: 3 powtórzenia (kalibracja #10); workflow_dispatch może nadpisać
      PERF_REPEAT: ${{ inputs.perf_repeat || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.run_id }}
          path: output
      - name: Dostęp do KVM
        run: ci/enable-kvm.sh
      - run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils genisoimage
      - run: ci/guard.sh --name "6a. Benchmarki" --timeout 45m --memory auto -- ci/perf.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf
          path: build/perf/
          if-no-files-found: ignore

  ephemeral:
    name: "6b. Wdrożenie tymczasowe (OpenStack)"
    needs: [lint, integration]
    # wymaga skonfigurowania: vars.OPENSTACK_EPHEMERAL=true, runner z dostępem do chmury testowej,
    # environment "openstack-test" z sekretem OPENSTACK_CLOUDS_YAML
    if: needs.lint.outputs.ephemeral == 'true' && vars.OPENSTACK_EPHEMERAL == 'true'
    runs-on: ${{ vars.OPENSTACK_RUNNER || 'ubuntu-24.04' }}
    environment: openstack-test
    timeout-minutes: 90
    env:
      OS_CLOUD: ${{ vars.OS_CLOUD }}
      OS_TEST_FLAVOR: ${{ vars.OS_TEST_FLAVOR }}
      OS_TEST_NETWORK: ${{ vars.OS_TEST_NETWORK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.run_id }}
          path: output
      - name: Klient OpenStack
        env:
          CLOUDS_YAML: ${{ secrets.OPENSTACK_CLOUDS_YAML }}
        run: |
          python3 -m pip install --user -q python-openstackclient
          mkdir -p ~/.config/openstack
          umask 077
          printf '%s\n' "$CLOUDS_YAML" > ~/.config/openstack/clouds.yaml
      - run: ci/guard.sh --name "6b. Wdrożenie tymczasowe" --timeout 80m --memory auto -- ci/ephemeral-openstack.sh

  ready:
    name: "Gotowe do code review"
    needs: [lint, build-check, security, security-report, observability, unit, mutation, formal-logic, build-base, integration, perf, ephemeral]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # joby i kroki przebiegu (diagnoza)
      checks: read # adnotacje strażnika (OOM/TIMEOUT)
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ci/ready.sh
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
      # kategoria każdego nieudanego joba i ścieżka z docs/ci-runbook.md (ponowienie: ci-retry.yml)
      - name: Diagnoza niepowodzenia
        if: failure()
        run: python3 ci/ci_failures.py diagnose --repo "$REPO" --run-id "$RUN_ID"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
