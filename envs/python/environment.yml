# Pakiety analityczne kernela Python (środowisko użytkowników TLJH, /opt/tljh/user).
#
# To jest plik "intencji". Po pierwszym budowaniu `make freeze` zapisuje obok
# environment.lock.yml z dokładnymi wersjami — przy kolejnych budowaniach
# Ansible używa locka, jeśli istnieje. Zmiana pakietów = edycja tego pliku,
# usunięcie locka, budowanie, `make freeze`, commit.
#
# JupyterLab, JupyterHub i Pythona dostarcza TLJH (wersja przypięta w group_vars) —
# nie dodawaj ich tutaj, żeby conda nie nadpisała paczek zainstalowanych przez pip.
name: wlb-python
channels:
  - conda-forge
dependencies:
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - sqlalchemy
  - psycopg2
  - pyarrow
  - pip
  # Minimalne wersje pakietów bazowych z instalatora TLJH (Miniforge), które miały znane podatności
  # (osv-scanner po pierwszym `make freeze`, 2026-09-26). Podbijaj przy nowych CVE, nie obniżaj.
  - urllib3>=2.7.0      # m.in. GHSA-2xpw-w6gg-jr37 (CVSS 8.9)
  - requests>=2.33.0    # GHSA-9hjg-9r4m-mvj7, GHSA-gc5v-m9x4-r6x2
  - idna>=3.15          # GHSA-65pc-fj4g-8rjx
  - setuptools>=83.0.0  # GHSA-5rjg-fvgr-3xxf (CVSS 8.8), GHSA-h35f-9h28-mq5c
  - wheel>=0.46.2       # GHSA-8rrh-rw8j-w5fx
  - h2>=4.4.1           # GHSA-847f-9342-265h, GHSA-6hr6-w5qg-qmwg
  - hpack>=4.2.0        # GHSA-8v8h-hg4w-mvq2
  - pip:
      - inspectomop
      - jupyter-app-launcher  # kafelek "Pomoc i zgłoszenia" w Launcherze JupyterLab (#54)
