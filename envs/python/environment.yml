# Pakiety analityczne kernela Python (środowisko użytkowników TLJH, /opt/tljh/user).
#
# To jest plik "intencji". Po pierwszym budowaniu `make freeze` zapisuje obok
# environment.lock.yml z dokładnymi wersjami — przy kolejnych budowaniach
# Ansible używa locka, jeśli istnieje. Zmiana pakietów = edycja tego pliku,
# usunięcie locka, budowanie, `make freeze`, commit.
#
# JupyterLab, JupyterHub i Pythona dostarcza TLJH (wersja przypięta w group_vars) —
# nie dodawaj ich tutaj, żeby conda nie nadpisała paczek zainstalowanych przez pip.
name: wlb-python
channels:
  - conda-forge
dependencies:
  - pandas
  - numpy
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - statsmodels
  - sqlalchemy
  - psycopg2
  - pyarrow
  # Obrazowanie medyczne DICOM (badania): pydicom + backend python-gdcm do odczytu
  # skompresowanych transfer syntaxów (JPEG/JPEG2000). matplotlib/seaborn/scikit-learn są wyżej.
  - pydicom
  - python-gdcm
  # Neuroobrazowanie (pipeline MRI/fMRI badaczy): nibabel (NIfTI), dcm2niix (konwersja DICOM->NIfTI, CLI),
  # snakemake (silnik workflow). numpy/pandas/scipy/matplotlib/pydicom są wyżej. FSL/FSLeyes/3DSlicer
  # to osobny temat (GUI + licencja + rozmiar) — nie tu.
  - nibabel
  - dcm2niix
  - snakemake
  - pip
  # Minimalne wersje pakietów bazowych z instalatora TLJH (Miniforge), które miały znane podatności
  # (osv-scanner po pierwszym `make freeze`, 2026-09-26). Podbijaj przy nowych CVE, nie obniżaj.
  - urllib3>=2.7.0      # m.in. GHSA-2xpw-w6gg-jr37 (CVSS 8.9)
  - requests>=2.33.0    # GHSA-9hjg-9r4m-mvj7, GHSA-gc5v-m9x4-r6x2
  - idna>=3.15          # GHSA-65pc-fj4g-8rjx
  - setuptools>=83.0.0  # GHSA-5rjg-fvgr-3xxf (CVSS 8.8), GHSA-h35f-9h28-mq5c
  - wheel>=0.46.2       # GHSA-8rrh-rw8j-w5fx
  - h2>=4.4.1           # GHSA-847f-9342-265h, GHSA-6hr6-w5qg-qmwg
  - hpack>=4.2.0        # GHSA-8v8h-hg4w-mvq2
  - certifi>=2026.10.19 # PYSEC-2026-4320 / GHSA-6q48-6c7w-9gw2 (CVSS 9.1)
  # Musi nadążać za certifi i solverem conda (conda-libmamba-solver wymaga >=2026.10.19);
  # stary pin w locku był usunięty z conda-forge (linux-64) → build nie solvował. #3/lock
  - ca-certificates>=2026.10.19
  - pillow>=13.0.0      # 9 podatności naprawionych w 13.0.0 (m.in. GHSA-8g5g-8vmr-9782 CVSS 9.2)
  - pip:
      - inspectomop
      - jupyter-app-launcher  # kafelek "Pomoc i zgłoszenia" w Launcherze JupyterLab (#54)
      # Tranzytywny (ciągnięty przez pakiety pip); podbity pod CVE, nie obniżaj.
      - aiohttp>=3.14.4  # GHSA-2g87-pp6c-29x5 (8.7), GHSA-5wr8-gcqf-gqf3 (8.2), GHSA-494j-54xm-rwp3
