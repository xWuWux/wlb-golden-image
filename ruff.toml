# Python w repozytorium: wlb-hub-user (środowisko huba TLJH), narzędzia CI i testy.
line-length = 120
target-version = "py310"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # polskie znaki i półpauzy w tekstach są zamierzone
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert i hasła testowe w testach

[lint.isort]
known-first-party = [
  "ci_failures",
  "ci_telemetry",
  "deployment_vars",
  "license_check",
  "observability_contract",
  "sca_requirements",
]
