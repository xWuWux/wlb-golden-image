# Polityka licencji dla oprogramowania instalowanego w obrazie WLB.
# Kontekst: użytek wewnętrzny GUMed (badania naukowe), obraz nie jest dystrybuowany poza platformę.
# Sprawdza ją ci/license_check.py (stage 3 pipeline'u).

# Dozwolone bez dodatkowej analizy
allowed:
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - PSF-2.0
  - MPL-2.0
  - Zlib
  - CC0-1.0
  - CC-BY
  - BSL-1.0
  - Artistic-2.0
  - GPL          # copyleft bez obowiązków przy użytku wewnętrznym bez dystrybucji
  - LGPL
  - EPL-2.0
  - OFL-1.1
  - HPND
  - CeCILL
  - Unicode
  - curl
  - OpenSSL

# Wymagają decyzji (wpis w `exceptions` z uzasadnieniem)
review:
  - AGPL-3.0     # obowiązki przy udostępnianiu przez sieć — zależne od sposobu użycia

# Niedozwolone — wyjątek tylko po decyzji działu prawnego
denied:
  - SSPL
  - BUSL
  - CC-BY-NC     # zakaz użytku komercyjnego — ryzyko przy współpracy z przemysłem

# Pakiety, których licencja wymaga uzasadnienia albo nie jest rozpoznawana automatycznie.
# Każdy wpis: ecosystem (cran | conda | pypi), package, note (kto, kiedy, dlaczego).
exceptions:
  - ecosystem: pypi
    package: inspectomop
    note: >-
      AGPL-3.0; użycie wewnętrzne bez modyfikacji, badacze nie udostępniają go jako usługi
      sieciowej osobom trzecim. DO POTWIERDZENIA przez dział prawny GUMed (2026-09-25).
  - ecosystem: cran
    package: stringi
    note: >-
      "file LICENSE" = BSD-3-Clause (stringi) + licencja ICU (Unicode, typu MIT) dla dołączonych
      bibliotek ICU; obie dozwolone (2026-09-25).
