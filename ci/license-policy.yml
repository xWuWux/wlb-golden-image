# Polityka licencji dla oprogramowania instalowanego w obrazie WLB.
# Kontekst: użytek wewnętrzny GUMed (badania naukowe), obraz nie jest dystrybuowany poza platformę.
# Sprawdza ją ci/license_check.py (stage 3 pipeline'u).

# Dozwolone bez dodatkowej analizy
allowed:
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - ISC
  - PSF-2.0
  - MPL-2.0
  - Zlib
  - CC0-1.0
  - CC-BY
  - BSL-1.0
  - Artistic-2.0
  - GPL          # copyleft bez obowiązków przy użytku wewnętrznym bez dystrybucji
  - LGPL
  - EPL-2.0
  - OFL-1.1
  - HPND
  - CeCILL
  - Unicode
  - curl
  - OpenSSL
  - 0BSD
  - bzip2
  - PostgreSQL
  - blessing     # SQLite
  - X11
  - OLDAP        # OpenLDAP Public License
  - TCL
  - IJG          # libjpeg
  # LicenseRef-* z conda-forge, treść sprawdzona ręcznie (2026-09-26): licencje liberalne
  - UFL-1.0      # Ubuntu Font Licence 1.0 (czcionki; zmiana nazwy przy modyfikacji)
  - libglvnd     # libglvnd: licencja typu MIT
  - Qhull        # Qhull: licencja liberalna, bez copyleftu

# Wymagają decyzji (wpis w `exceptions` z uzasadnieniem)
review:
  - AGPL-3.0     # obowiązki przy udostępnianiu przez sieć — zależne od sposobu użycia

# Niedozwolone — wyjątek tylko po decyzji działu prawnego
denied:
  - SSPL
  - BUSL
  - CC-BY-NC     # zakaz użytku komercyjnego — ryzyko przy współpracy z przemysłem

# Pakiety, których licencja wymaga uzasadnienia albo nie jest rozpoznawana automatycznie.
# Każdy wpis: ecosystem (cran | conda | pypi), package, note (kto, kiedy, dlaczego).
exceptions:
  - ecosystem: pypi
    package: inspectomop
    note: >-
      AGPL-3.0; użycie wewnętrzne bez modyfikacji, badacze nie udostępniają go jako usługi
      sieciowej osobom trzecim. DO POTWIERDZENIA przez dział prawny GUMed (2026-09-25).
  - ecosystem: conda
    package: _libgcc_mutex
    note: >-
      Metapakiet conda-forge bez kodu (wybór wariantu libgcc), brak wpisu licencji w API (2026-09-26).
  - ecosystem: cran
    package: stringi
    note: >-
      "file LICENSE" = BSD-3-Clause (stringi) + licencja ICU (Unicode, typu MIT) dla dołączonych
      bibliotek ICU; obie dozwolone (2026-09-25).
  # Stos snakemake (silnik workflow neuro, #133): metadane PyPI nie zawierają pola licencji,
  # ale upstream to MIT (dozwolona) — zweryfikowane 2026-10-26 ze źródeł wymienionych niżej.
  - ecosystem: pypi
    package: conda-inject
    note: >-
      MIT (github.com/koesterlab/conda-inject; listy Oracle EPEL / Gentoo / FreshPorts); brak pola
      licencji w metadanych PyPI. Zależność snakemake (#133). Zweryfikowane 2026-10-26.
  - ecosystem: pypi
    package: snakemake-interface-common
    note: >-
      MIT (github.com/snakemake/snakemake-interface-common, GitHub license API); brak pola licencji
      w metadanych PyPI. Zależność snakemake (#133). Zweryfikowane 2026-10-26.
  - ecosystem: pypi
    package: snakemake-interface-logger-plugins
    note: >-
      MIT (org snakemake, ten sam autor i licencja co pozostałe snakemake-interface-*); brak pola
      w metadanych PyPI. Zależność snakemake (#133). Zweryfikowane 2026-10-26.
  - ecosystem: pypi
    package: snakemake-interface-report-plugins
    note: >-
      MIT (org snakemake, jak pozostałe snakemake-interface-*); brak pola w metadanych PyPI.
      Zależność snakemake (#133). Zweryfikowane 2026-10-26.
  - ecosystem: pypi
    package: snakemake-interface-scheduler-plugins
    note: >-
      MIT (org snakemake, jak pozostałe snakemake-interface-*); brak pola w metadanych PyPI.
      Zależność snakemake (#133). Zweryfikowane 2026-10-26.
  - ecosystem: pypi
    package: snakemake-interface-storage-plugins
    note: >-
      MIT (github.com/snakemake/snakemake-interface-storage-plugins, GitHub license API); brak pola
      w metadanych PyPI. Zależność snakemake (#133). Zweryfikowane 2026-10-26.
