#cloud-config
# Przykładowy user-data dla VM Laboratorium uruchamianej z golden image WLB.
# Podaj go przy tworzeniu instancji (OpenStack: --user-data, Proxmox: cicustom=user=...).
# Wszystko, co zależy od Laboratorium, trafia do /etc/wlb/lab.env; resztę robi wlb-firstboot.

hostname: lab-example01
fqdn: lab-example01.wlb.local
prefer_fqdn_over_hostname: false

users:
  - name: wlbadmin                      # administrator platformy (SSH + sudo)
    uid: 1001                           # < 10000: poza zakresem UID badaczy (audyt, nftables)
    groups: [sudo, wlb-platform-admins]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAA... admin@wlb     # klucz administratora platformy
ssh_pwauth: false

# Dysk roboczy (drugi wolumen) -> /workspace. Systemowy pochodzi z obrazu i jest jednorazowy.
disk_setup:
  /dev/vdb:
    table_type: gpt
    layout: true
    overwrite: false
fs_setup:
  - label: workspace
    filesystem: ext4
    device: /dev/vdb
    partition: auto

# Udziały Laboratorium (§10). Przykład dla CephFS; dla NFS: [serwer:/eksport, /sluza-in, nfs4, "ro,..."]
mounts:
  - [LABEL=workspace, /workspace, ext4, "defaults,nodev,nosuid", "0", "2"]
  - - "10.50.0.1,10.50.0.2:/labs/lab-example01/sluza-in"
    - /sluza-in
    - ceph
    - "name=lab-example01,secretfile=/etc/ceph/lab.secret,ro,nodev,nosuid,noexec,_netdev"
  - - "10.50.0.1,10.50.0.2:/labs/lab-example01/sluza-out"
    - /sluza-out
    - ceph
    - "name=lab-example01,secretfile=/etc/ceph/lab.secret,rw,nodev,nosuid,noexec,_netdev"
  - - "10.50.0.1,10.50.0.2:/labs/lab-example01/data-mart"
    - /data-mart
    - ceph
    - "name=lab-example01,secretfile=/etc/ceph/lab.secret,ro,nodev,nosuid,noexec,_netdev"
  # Wspólny katalog projektu (§10, #50): rw, współdzielony przez wszystkie VM zespołu (#19). Bez tego
  # udziału /projekt działa jako katalog lokalny na dysku roboczym (współdzielenie tylko w obrębie jednej VM).
  - - "10.50.0.1,10.50.0.2:/labs/lab-example01/projekt"
    - /projekt
    - ceph
    - "name=lab-example01,secretfile=/etc/ceph/lab.secret,rw,acl,nodev,nosuid,noexec,_netdev"
  - - "10.50.0.1,10.50.0.2:/platform/docs"
    - /docs
    - ceph
    - "name=lab-example01,secretfile=/etc/ceph/lab.secret,ro,nodev,nosuid,_netdev"

write_files:
  - path: /etc/ceph/lab.secret
    permissions: "0600"
    content: "<klucz CephX Laboratorium — z menedżera sekretów, nie z repozytorium>"
  - path: /etc/wlb/lab.env
    permissions: "0600"
    content: |
      LAB_NAME=lab-example01
      HUB_ADMIN_USER=admin-klienta
      PROXY_URL=http://10.20.0.10:3128
      NO_PROXY=localhost,127.0.0.1,.wlb.local
      # IMG-004/#23: deny = zakaz instalacji przez badacza (§24.c). mirror = kuratorowany mirror,
      # wtedy odkomentuj adresy mirrora poniżej.
      RESEARCHER_PACKAGE_INSTALL=deny
      #PYPI_INDEX_URL=https://pypi-mirror.wlb.local/simple
      #CRAN_MIRROR_URL=https://cran-mirror.wlb.local
      EGRESS_ALLOW="10.20.0.10:3128 10.30.0.5:5432"
      ADMIN_SSH_CIDR=10.10.0.0/24
      HUB_ALLOWED_CIDR=10.10.1.0/24
      # native = konta lokalne w bazie huba; oidc = SSO IdP (wymaga OIDC_* — patrz
      # cloud-init/lab.env.example). Zmiana tutaj to zmiana sposobu logowania badaczy.
      AUTH_MODE=native
      # 1 = dane przykładowe lokalnego testu obrazu. Nigdy na produkcji.
      LOCAL_TEST_MODE=0
      # TLS huba (#18/IMG-005, §20): HTTPS na 443 z certyfikatu wewnętrznego CA GUMed (Let's Encrypt
      # odpada bez internetu). Cert i klucz z write_files niżej. HUB_TLS=0 tylko dev/izolowana sieć.
      HUB_TLS=1
      HUB_TLS_CERT=/etc/wlb/hub-tls.crt
      HUB_TLS_KEY=/etc/wlb/hub-tls.key
      NTP_SERVERS="10.10.0.2 10.10.0.3"
      SIEM_HOST=10.40.0.20
      SIEM_PROTOCOL=tcp
      SIEM_TLS=1
      SIEM_TLS_NAME=siem.wlb.local
      SIEM_CA_CERT=/etc/wlb/siem-ca.pem
      SIEM_PORT=6514
      # Wzory opcjonalne — odkomentuj, gdy odchodzisz od wartości domyślnej:
      #OIDC_GROUPS_CLAIM=groups
      #RESEARCHERS_PER_VM=1
      #SYSTEM_MEM_RESERVE=4G
      #RESEARCHER_MEM_LIMIT=16G
      #RESEARCHER_CPU_LIMIT=4
      #RESEARCHER_TASKS_MAX=2048
  # CA, które wystawiło certyfikat SIEM (sam certyfikat publiczny — bez klucza prywatnego)
  - path: /etc/wlb/siem-ca.pem
    permissions: "0644"
    content: |
      -----BEGIN CERTIFICATE-----
      <certyfikat CA SIEM z PKI GUMed>
      -----END CERTIFICATE-----
  # Certyfikat TLS huba (publiczny) wystawiony przez wewnętrzne CA GUMed na nazwę Laboratorium (#18)
  - path: /etc/wlb/hub-tls.crt
    permissions: "0644"
    content: |
      -----BEGIN CERTIFICATE-----
      <certyfikat serwera huba z PKI GUMed, CN/SAN = nazwa dostępowa Laboratorium>
      -----END CERTIFICATE-----
  # Klucz prywatny huba — z menedżera sekretów, NIE z repozytorium (jak /etc/ceph/lab.secret)
  - path: /etc/wlb/hub-tls.key
    permissions: "0600"
    content: "<klucz prywatny certyfikatu huba — z menedżera sekretów, nie z repozytorium>"

runcmd:
  - [/usr/local/sbin/wlb-firstboot]
