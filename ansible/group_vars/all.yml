# Parametry golden image WLB — kategoria ogólnego przeznaczenia (MVP).
# Wartości per-Laboratorium (proxy, SIEM, administrator huba) NIE są tutaj —
# przychodzą przez cloud-init w /etc/wlb/lab.env (patrz cloud-init/lab-user-data.example.yaml).

# Nadpisywane przez Packera
wlb_image_name: wlb-general
wlb_image_version: 0.0.0-dev
wlb_image_date: ""
wlb_artifacts_dir: "{{ playbook_dir }}/../build/artifacts/dev"

wlb_timezone: Europe/Warsaw
wlb_locales: [en_US.UTF-8, pl_PL.UTF-8]

# Grupa, która ma dostęp SSH (administratorzy platformy). Badacze nie logują się przez SSH.
wlb_platform_admin_group: wlb-platform-admins

# Badacze (użytkownicy tworzeni przez TLJH) dostają UID od 10000 — pozwala to odróżnić ich
# w regułach audytu i nftables od administratorów platformy (UID < 10000).
wlb_researcher_uid_min: 10000
wlb_researcher_uid_max: 59999
wlb_researcher_group: jupyterhub-users   # grupa nadawana przez TLJH każdemu użytkownikowi huba

# --- Struktura katalogów (§10 Regulaminu WLB) -------------------------------
wlb_directories:
  - { path: /workspace, owner: root, group: root, mode: "0711" }                     # katalogi domowe; badacz widzi tylko swój
  - { path: /workspace/.wlb-hub, owner: root, group: root, mode: "0700" }            # baza huba (konta), objęta backupem
  - { path: /workspace/.wlb-export-queue, owner: root, group: root, mode: "0700" }   # kolejka eksportu (#4)
  - { path: /sluza-in, owner: root, group: jupyterhub-users, mode: "0750" }          # tylko odczyt
  - { path: /sluza-out, owner: root, group: jupyterhub-users, mode: "1730" }         # tylko zapis, bez listowania
  - { path: /sluza-odrzucone, owner: root, group: jupyterhub-users, mode: "0750" }   # zwrotne powody odrzuceń eksportu (#162/IMG-008); badacz czyta
  # potwierdzenia przyjęcia do kolejki (#208); treść pliku 0640 tylko dla właściciela
  - { path: /sluza-potwierdzenia, owner: root, group: jupyterhub-users, mode: "0750" }
  - { path: /data-mart, owner: root, group: jupyterhub-users, mode: "0750" }         # tylko odczyt
  - { path: /docs, owner: root, group: root, mode: "0755" }                          # tylko odczyt
  # wspólny katalog projektu (§10, #50): setgid + grupa zespołu; domyślny ACL g::rwX ustawia wlb-firstboot.
  # Zapisywalny dla badaczy, więc NIE w wlb_readonly_paths (poniżej).
  - { path: /projekt, owner: root, group: jupyterhub-users, mode: "2770" }
wlb_readonly_paths: [/sluza-in, /data-mart, /docs]
# Kolejka wniosków o eksport na dysku roboczym: przeżywa wymianę dysku systemowego (nowa wersja
# obrazu) i jest objęta backupem. Badacze jej nie widzą (/workspace 0711, kolejka 0700 root). #4
wlb_export_queue_dir: /workspace/.wlb-export-queue

# Budżet całej usługi śluzy i jej potomków (#149), liczby całkowite; strojenie przy budowie.
# 256/192 MiB to punkt startowy do kalibracji, nie gwarancja obsługi dowolnego drzewa plików.
wlb_sluza_memory_max_mb: 256
wlb_sluza_memory_high_mb: 192
wlb_sluza_tasks_max: 32 # zapas dla potoków find/sort/xargs/hash; 10 jest zbyt blisko ich kosztu
wlb_sluza_io_weight: 50 # względna waga, NIE twardy limit przepustowości

# --- The Littlest JupyterHub -------------------------------------------------
tljh_version: "2.0.0"
# Baza huba na dysku roboczym: konta badaczy przeżywają wymianę dysku systemowego
# (nowa wersja obrazu) i są objęte backupem razem z /workspace.
tljh_hub_db_path: /workspace/.wlb-hub/jupyterhub.sqlite
# Spójna kopia bazy huba przed snapshotem storage (#8): timer robi migawkę online
# (sqlite3 .backup) na dysku roboczym, z której da się odtworzyć konta i hasła.
hub_db_backup_dir: "{{ tljh_hub_db_path | dirname }}/backup"
hub_db_backup_keep: 24                  # ile kopii zostawić (rotacja); przy hourly ~1 doba
hub_db_backup_oncalendar: hourly        # jak często robić kopię (format systemd OnCalendar)
tljh_idle_timeout_seconds: 1800        # 30 min bezczynności
tljh_max_session_seconds: 43200        # §9.5: twardy limit 12 h
tljh_cull_every_seconds: 60
# limity zasobów badaczy wylicza wlb-firstboot z RAM/vCPU VM (nadpisania w lab.env, #30)
tljh_admins_have_sudo: false           # TLJH domyślnie daje adminom huba sudo; wyłączamy (§21, §24.c)
# Konta bezosobowe uNN/a01 są pre-provisionowane przez wlb-firstboot (IMG-002/#102), nie zakładane
# samodzielnie — formularz rejestracji wyłączony. Dostępu pilnuje is_authorized (ustawiane przez wlb-hub-user).
tljh_enable_signup: false
tljh_password_min_length: 12
tljh_allowed_failed_logins: 5
tljh_lockout_seconds: 600

# --- Python (kernel domyślny, środowisko użytkowników TLJH) -------------------
python_env_file: "{{ playbook_dir }}/../envs/python/environment.yml"
python_env_lock_file: "{{ playbook_dir }}/../envs/python/environment.lock.yml"

# --- R -------------------------------------------------------------------------
# Snapshot Posit Package Managera — wersje pakietów CRAN zamrożone na tę datę (binaria dla noble).
r_cran_snapshot_date: "2026-09-01"
r_cran_repo: "https://packagemanager.posit.co/cran/__linux__/noble/{{ r_cran_snapshot_date }}"
r_env_dir: "{{ playbook_dir }}/../envs/r"
r_jdbc_dir: /opt/wlb/jdbc

# --- Julia (kernel IJulia; strona JupyterHub IP_CMC reklamuje Python/R/Julia) #111 -----
julia_version: "1.11.9"
julia_series: "1.11"
# SHA-256 z oficjalnego https://julialang-s3.julialang.org/bin/versions.json (zweryfikowane 2026-10-20)
julia_sha256: "b36363356d7a05eaf8b7b9e7a91c710f6bd3d2940be4d4e6d14b9a9f2927de35"
julia_tarball_url: "https://julialang-s3.julialang.org/bin/linux/x64/{{ julia_series }}/julia-{{ julia_version }}-linux-x86_64.tar.gz"
julia_prefix: /opt/julia-{{ julia_version }}
# Wspólny depot (tylko do odczytu dla badaczy) i wspólny projekt z przypiętym IJulia.
julia_depot_path: /opt/wlb/envs/julia
julia_project_dir: /opt/wlb/envs/julia-project
julia_env_dir: "{{ playbook_dir }}/../envs/julia"

# --- RStudio Server (opcjonalny) --------------------------------------------------
wlb_rstudio_enabled: false
rstudio_server_deb_url: https://s3.amazonaws.com/rstudio-server/server/jammy/amd64/rstudio-server-2026.09.0-174-amd64.deb
rstudio_rsession_proxy_spec: jupyter-rsession-proxy

# --- Pulpit w przeglądarce (flavor wlb-memory, #106) ------------------------------
# W site.yml gated (jak RStudio); flavor wlb-memory nakłada rolę warstwowo przez desktop.yml.
wlb_desktop_enabled: false
desktop_proxy_spec: jupyter-remote-desktop-proxy

# --- jamovi (Flatpak, flavor wlb-histologia, #108) --------------------------------
# jamovi dla Linuksa jest TYLKO jako Flatpak (brak apt/tarballa) — rola histo_apps instaluje go z Flathub
# w czasie budowania (warstwa ma sieć) i uruchamia jako aplikację pulpitową w sesji XFCE (noVNC).
jamovi_flatpak_id: org.jamovi.jamovi
jamovi_flathub_repo_url: https://flathub.org/repo/flathub.flatpakrepo
# Katalog danych badacza udostępniany sandboxowi jamovi (open/save plików). /workspace = trwały dysk
# roboczy z homes badaczy (/workspace/jupyter-<login>).
jamovi_data_path: /workspace

# --- Kontrakt wizualny pulpitu XFCE (#204) ----------------------------------------
# JEDYNE źródło prawdy dla wyglądu na flavorach z pulpitem. Rola desktop renderuje z tego:
#   1) /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/<kanał>.xml — systemowe domyślne xfconf
#      (mechanizm XDG_CONFIG_DIRS). To główny kanał wdrożenia: konta badaczy powstają
#      `useradd -M` (bez kopiowania /etc/skel!), więc sam /etc/skel ich by nie dotyczył.
#   2) /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/<kanał>.xml — dla kont zakładanych
#      z -m oraz jako jawna deklaracja „wygląd świeżego profilu" (decyzja z #204: kontrakt
#      dotyczy ŚWIEŻEGO profilu + wartości domyślnych; badacz może nadpisać wygląd u siebie,
#      pliki użytkownika mają priorytet nad systemowymi; bez migracji istniejących profili).
#   3) /etc/wlb/desktop-contract — płaski, maszynowo czytelny widok tego samego słownika;
#      czytają go testy (tests/acceptance.d/42-pulpit-wartosci.sh) — wartości NIE są
#      duplikowane w teście.
# Motyw/ikony/kursor = Adwaita: na minimalnym XFCE stockowe domyślne Ubuntu (Greybird,
# elementary-xfce-dark) wskazują pakiety NIEzainstalowane w tym obrazie — faktycznie i
# deterministycznie dostępne jest tylko Adwaita (GTK3 wbudowany w libgtk-3 + adwaita-icon-theme).
# Fonty: stockowe aliasy fontconfig Sans/Monospace, które resolving dają DejaVu (pinned na obrazie).
# DPI 96 (xfsettingsd sam mnoży /Xft/DPI przez 1024 dla XSETTINGS — w xfconf zwykłe 96, NIE 98304), geometria/klawiatura/locale = wartości efektywne
# dzisiejszego obrazu, przypięte, aby ich cicha zmiana była wykrywana przez test (#204).
desktop_xfconf:
  xsettings:
    Net:
      ThemeName: {type: string, value: Adwaita}
      IconThemeName: {type: string, value: Adwaita}
      # Pozostałe klucze: domyślne z pakietowego xsettings.xml (xfce4-settings) — plik jest
      # odsunięty dpkg-divert, więc przenosimy je tu, by dywersja niczego nie gubiła.
      DoubleClickTime: {type: int, value: 400}
      DoubleClickDistance: {type: int, value: 5}
      DndDragThreshold: {type: int, value: 8}
      CursorBlink: {type: bool, value: "true"}
      CursorBlinkTime: {type: int, value: 1200}
      SoundThemeName: {type: string, value: default}
      EnableEventSounds: {type: bool, value: "false"}
      EnableInputFeedbackSounds: {type: bool, value: "false"}
    Gtk:
      CursorThemeName: {type: string, value: Adwaita}
      CanChangeAccels: {type: bool, value: "false"}
      ColorPalette: {type: string, value: "black:white:gray50:red:purple:blue:light blue:green:yellow:orange:lavender:\
        brown:goldenrod4:dodger blue:pink:light green:gray10:gray30:gray75:gray90"}
      IconSizes: {type: string, value: ""}
      KeyThemeName: {type: string, value: ""}
      ToolbarStyle: {type: string, value: icons}
      ToolbarIconSize: {type: int, value: 3}
      MenuImages: {type: bool, value: "true"}
      ButtonImages: {type: bool, value: "true"}
      MenuBarAccel: {type: string, value: F10}
      CursorThemeSize: {type: int, value: 0}
      DecorationLayout: {type: string, value: "menu:minimize,maximize,close"}
      DialogsUseHeader: {type: bool, value: "false"}
      TitlebarMiddleClick: {type: string, value: lower}
      FontName: {type: string, value: "Sans 10"}
      MonospaceFontName: {type: string, value: "Monospace 10"}
    Xft:
      DPI: {type: int, value: 96} # zwykłe DPI; xfsettingsd: CLAMP(50..500)*1024 (98304 dałoby 500 DPI)
      Antialias: {type: int, value: -1} # -1 = decyzja fontconfiga (stock XFCE)
      Hinting: {type: int, value: -1}
      HintStyle: {type: string, value: hintnone}
      RGBA: {type: string, value: none}
    Gdk:
      WindowScalingFactor: {type: int, value: 1}
  xfwm4:
    general:
      workspace_count: {type: int, value: 4}
      theme: {type: string, value: Default} # motyw okien; Default dostarcza pakiet xfwm4
  xfce4-panel:
    configver: {type: int, value: 2}
    panels:
      type: array
      etype: int
      values: [1]
      panel-1:
        position: {type: string, value: "p=12;x=0;y=0"} # SNAP_POSITION_S = dół (enum panel-window.c: 6 = NW, 12 = S)
        position-locked: {type: bool, value: "true"}
        size: {type: uint, value: 28}
        length: {type: uint, value: 100}
        icon-size: {type: uint, value: 16}
        plugin-ids:
          type: array
          etype: int
          values: [1, 2, 3, 4, 5, 6, 7]
    plugins:
      plugin-1: {type: string, value: applicationsmenu}
      plugin-2:
        type: string
        value: separator
        expand: {type: bool, value: "true"}
        style: {type: uint, value: 0}
      plugin-3:
        type: string
        value: tasklist
        grouping: {type: uint, value: 1}
      plugin-4: {type: string, value: separator}
      plugin-5:
        type: string
        value: systray
        square-icons: {type: bool, value: "true"}
      plugin-6: {type: string, value: clock}
      plugin-7: {type: string, value: actions}
  xfce4-desktop:
    backdrop:
      screen0:
        monitorVNC-0: # TigerVNC zgłasza jedyny monitor jako VNC-0 (wykryte empirycznie, #204)
          workspace0: &wlb_desktop_workspace
            color-style: {type: int, value: 0} # 0 = XFCE_BACKDROP_COLOR_SOLID (1 = gradient poziomy)
            first-color: {type: string, value: "#303030"}
            image-show: {type: bool, value: "false"}
            image-style: {type: uint, value: 5} # SCALED; przy image-show=false bez wpływu, wartość stockowa
            last-image: {type: string, value: /usr/share/backgrounds/xfce/xfce-shapes.svg}
          workspace1: *wlb_desktop_workspace
          workspace2: *wlb_desktop_workspace
          workspace3: *wlb_desktop_workspace

# Pozostałe wartości kontraktu wizualnego (poza kanałami xfconf).
# Wersja kontraktu: podbij przy każdej zmianie zestawu/znaczenia wartości (emitowana do
# /etc/wlb/desktop-contract jako contract|version|N; test i CI sprawdzają jej obecność).
desktop_contract_version: 1
desktop_contract_locale: C.UTF-8            # LANG w /etc/default/locale — zmiana SYSTEMOWA (nie tylko pulpitu): formaty/sortowanie/komunikaty C.UTF-8
desktop_contract_keyboard: {rules: evdev, model: pc105, layout: us} # efektywny default Xvnc; XFCE nie wymusza Xkb (#204 zachowawczo)
desktop_contract_geometry: 1024x768         # geometria sesji = default Xtigervnc (proxy nie nadpisuje); test sprawdzaja na swiezym X
desktop_contract_fonts: {sans: "DejaVu Sans", mono: "DejaVu Sans Mono"} # oczekiwany wynik fc-match dla aliasów Sans/Monospace

# --- Stos neuroobrazowania (flavor wlb-radiologia, #135; rola neuro_apps) ----------
# Używane tylko przez ansible/radiologia.yml. FSL (conda-based) instaluje też FSLeyes.
# Licencja FSL: niekomercyjnie — potwierdzone (#134).
fsl_version: "6.0.7.22" # najnowsza wg manifestu fslconda (2026-10-23)
fsl_dir: /usr/local/fsl
fsl_installer_url: https://fsl.fmrib.ox.ac.uk/fsldownloads/fslconda/releases/fslinstaller.py
# 3DSlicer 5.12.4: przypięty item Kitware (Slicer-5.12.4-linux-amd64.tar.gz). Girder podaje sha512
# (nie sha256) — get_url to obsługuje. URL item/<id>/download jest stały dla tej wersji.
slicer_version: "5.12.4"
slicer_url: https://slicer-packages.kitware.com/api/v1/item/6aa1beb7ce9de556d3010204/download
slicer_sha512: "ac76c5061a8fff20d4e59732855f74360930fd4891450085bcbc6a8eb1a1f4ade9a1ca4fc633142661b714dbe8c4604306079f9546e52053faa5e6f99410cf76"
slicer_prefix: /opt

# --- Audyt ------------------------------------------------------------------------
# Po pierwszym starcie reguły są blokowane (auditctl -e 2) — nawet root nie zmieni ich bez restartu.
wlb_audit_immutable: true
