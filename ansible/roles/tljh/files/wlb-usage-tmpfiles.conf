# Stan korelacji sesji do rekordu użycia (#98). /run to tmpfs: stan ma przezywac restart HUBA,
# nie reboot — po reboocie i tak jest uniewazniony przez kontrole BootID, wiec tmpfs jest
# swiadomym wyborem, nie przeoczeniem. Uprawnienia 0700: badacz nie moze odczytac ani
# podpiernic cudzego pliku stanu (patrz akceptacja "Stan sesji nieczytalny dla badacza").
d /run/wlb 0755 root root -
d /run/wlb/usage 0750 root root -
d /run/wlb/usage/sessions 0700 root root -
