- name: Pobierz instalator TLJH (przypięta wersja)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/jupyterhub/the-littlest-jupyterhub/{{ tljh_version }}/bootstrap/bootstrap.py"
    dest: /opt/wlb/tljh-bootstrap.py
    mode: "0644"
  register: tljh_bootstrap_download
  until: tljh_bootstrap_download is succeeded
  retries: 3
  delay: 30

- name: Instalacja TLJH
  ansible.builtin.command: python3 /opt/wlb/tljh-bootstrap.py --version {{ tljh_version }}
  args:
    creates: /opt/tljh/hub/bin/jupyterhub
  environment:
    # pip wywoływany przez instalator dziedziczy te ustawienia; domyślne 5 prób po 15 s
    # nie wystarcza na kilkuminutową awarię PyPI
    PIP_DEFAULT_TIMEOUT: "60"
    PIP_RETRIES: "10"
  # instalator jest idempotentny — po przerwanym pobieraniu można go uruchomić ponownie
  register: tljh_install
  until: tljh_install is succeeded
  retries: 3
  delay: 30

- name: Katalog drop-inów usługi jupyterhub
  ansible.builtin.file:
    path: /etc/systemd/system/jupyterhub.service.d
    state: directory
    mode: "0755"

- name: Konfiguracja TLJH
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /opt/tljh/config/config.yaml
    mode: "0640"
  notify: Reload hub

- name: Katalog dodatkowej konfiguracji JupyterHub
  ansible.builtin.file:
    path: /opt/tljh/config/jupyterhub_config.d
    state: directory
    mode: "0755"

- name: Ustawienia JupyterHub spoza tljh-config
  ansible.builtin.template:
    src: 10-wlb.py.j2
    dest: /opt/tljh/config/jupyterhub_config.d/10-wlb.py
    mode: "0644"
  notify: Reload hub

- name: Katalog identyfikacji wizualnej huba (#53)
  ansible.builtin.file:
    path: /opt/tljh/config/branding
    state: directory
    mode: "0755"

- name: Logo IP_CMC (#53)
  ansible.builtin.copy:
    src: branding/ipcmc-logo.png
    dest: /opt/tljh/config/branding/ipcmc-logo.png
    mode: "0644"
  notify: Reload hub

# Kafelek "Pomoc i zgłoszenia" w Launcherze JupyterLab. Pakiet jupyter-app-launcher jest w
# środowisku użytkowników (envs/python); tu tylko konfiguracja kafelka i strona pomocy. #54
- name: Katalog konfiguracji Launchera (jupyter-app-launcher)
  ansible.builtin.file:
    path: /opt/tljh/user/share/jupyter/jupyter_app_launcher
    state: directory
    mode: "0755"

- name: Kafelek pomocy i strona pomocy (#54)
  ansible.builtin.copy:
    src: "launcher/{{ item }}"
    dest: "/opt/tljh/user/share/jupyter/jupyter_app_launcher/{{ item }}"
    mode: "0644"
  loop:
    - jp_app_launcher.yaml
    - pomoc.md

# --- Blokada pobierania plików na urządzenie badacza (#7, Regulamin §14, §24.e — środek częściowy) ---
# Po stronie serwera, w Traefiku przed hubem — poza zasięgiem badacza (ukrycie przycisków w JupyterLab
# badacz cofa własnym ~/.jupyter/labconfig). Zamyka jawne drogi: /files (Download, ?download=1),
# /nbconvert (Export Notebook As), /view. Otwarte zostają: /api/contents (przez nie JupyterLab
# otwiera i zapisuje każdy plik), schowek i zrzuty ekranu — pełną egzekucję daje dopiero VDI (#18).
# Koszt: obrazki z Markdown (![](plik.png)) JupyterLab ładuje przez /files i się nie wyświetlą.
# TLJH nadpisuje w katalogu reguł tylko dynamic.toml i rules.toml; Traefik obserwuje cały katalog.
- name: Traefik — blokada pobierania plików (403 dla /files, /nbconvert, /view)
  ansible.builtin.copy:
    dest: /opt/tljh/state/rules/wlb-block-download.toml
    mode: "0600"
    content: |
      # Zarządzane przez Ansible (rola tljh) — #7
      # 1) jawne drogi pobierania; 2) ścieżki nieznormalizowane (segment "." lub "..", pusty segment "//") —
      # Traefik dopasowuje surową ścieżkę, więc ./files czy x/../files omijałyby regułę 1, gdyby serwer
      # za proxy je normalizował. Klient JupyterLab takich ścieżek nie wysyła.
      [http.routers.wlb-block-download]
        rule = """PathRegexp(`(?i)^/user/[^/]+/(files|nbconvert|view)(/|$)`) || \
                  PathRegexp(`^/user/[^/]+/(.*/)?\\.\\.?(/|$)`) || PathRegexp(`^/user/[^/]+(/.*)?//`)"""
        priority = 1000000
        middlewares = ["wlb-deny-all"]
        service = "wlb-deny-all"

      # odmowa 403 dla każdego adresu (żaden nie pasuje do 192.0.2.0/32 — sieć dokumentacyjna)
      [http.middlewares.wlb-deny-all.ipAllowList]
        sourceRange = ["192.0.2.0/32"]

      # usługa nigdy nie jest wywoływana (middleware odrzuca wcześniej) — wymagana przez router
      [[http.services.wlb-deny-all.loadBalancer.servers]]
        url = "http://127.0.0.1:9"

# ślad odmów w logu: Traefik (access log JSON -> journald -> SIEM) domyślnie loguje tylko 5xx
- name: Traefik — log odmów 403 (próby pobrania, §21)
  ansible.builtin.copy:
    dest: /opt/tljh/config/traefik_config.d/10-wlb-accesslog.toml
    mode: "0600"
    content: |
      # Zarządzane przez Ansible (rola tljh) — #7: odmowy blokady pobierania trafiają do SIEM
      [accessLog.filters]
      statusCodes = ["403", "500-999"]
  notify: Reload proxy

- name: JupyterLab — katalog konfiguracji stron
  ansible.builtin.file:
    path: /opt/tljh/user/etc/jupyter/labconfig
    state: directory
    mode: "0755"

- name: JupyterLab — obecna konfiguracja stron
  ansible.builtin.slurp:
    path: /opt/tljh/user/etc/jupyter/labconfig/page_config.json
  register: tljh_page_config
  failed_when: false

# wygoda, nie kontrola: bez przycisków badacz nie trafia na błąd 403 przy zwykłym kliknięciu
- name: JupyterLab — ukryte polecenia pobierania (blokadę daje Traefik)
  ansible.builtin.copy:
    dest: /opt/tljh/user/etc/jupyter/labconfig/page_config.json
    mode: "0644"
    content: "{{ (tljh_page_config.content | default('e30=') | b64decode | from_json)
      | combine({'disabledExtensions': {'@jupyterlab/filebrowser-extension:download': true,
                                       '@jupyterlab/docmanager-extension:download': true}}, recursive=true)
      | to_nice_json }}\n"
# --- Limity zasobów badaczy (#30) --------------------------------------------------------------
# Wszystkie serwery notebooków w jednym slice. Jego limit pamięci (RAM VM minus rezerwa na usługi)
# oraz limity na badacza wylicza wlb-firstboot z RAM i vCPU danej VM (kategorie VM się różnią).
# "-" w nazwie to hierarchia systemd: wlb-badacze.slice leży w wlb.slice.
- name: Slice procesów badaczy
  ansible.builtin.copy:
    dest: /etc/systemd/system/wlb-badacze.slice
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola tljh) — #30. Limity: wlb-badacze.slice.d/ (wlb-firstboot).
      [Unit]
      Description=WLB: serwery notebooków badaczy (JupyterHub)
      Before=slices.target

      [Slice]
      MemoryAccounting=yes
      CPUAccounting=yes
      TasksAccounting=yes

- name: Hub startuje dopiero po zamontowaniu dysku roboczego
  ansible.builtin.copy:
    dest: /etc/systemd/system/jupyterhub.service.d/10-wlb.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola tljh) — baza huba leży na /workspace
      [Unit]
      RequiresMountsFor={{ tljh_hub_db_path | dirname }}

- name: Administratorzy huba bez sudo
  ansible.builtin.file:
    path: /etc/sudoers.d/jupyterhub-admins
    state: absent
  when: not tljh_admins_have_sudo | bool

- name: Narzędzie do zakładania kont huba
  ansible.builtin.copy:
    src: wlb-hub-user
    dest: /usr/local/sbin/wlb-hub-user
    mode: "0750"

# --- Spójna kopia bazy huba przed snapshotem storage (#8) -----------------------------
- name: Narzędzie do spójnej kopii bazy huba (#8)
  ansible.builtin.copy:
    src: wlb-hub-db-backup
    dest: /usr/local/sbin/wlb-hub-db-backup
    mode: "0750"

- name: Usługa kopii bazy huba (#8)
  ansible.builtin.copy:
    dest: /etc/systemd/system/wlb-hub-db-backup.service
    mode: "0644"
    content: |
      [Unit]
      Description=WLB: spójna kopia bazy huba (SQLite) dla snapshotu storage (#8)
      # baza i kopie leżą na dysku roboczym — bez niego kopia trafiłaby na dysk systemowy
      RequiresMountsFor={{ hub_db_backup_dir | dirname }}

      [Service]
      Type=oneshot
      Environment=HUB_DB={{ tljh_hub_db_path }}
      Environment=BACKUP_DIR={{ hub_db_backup_dir }}
      Environment=KEEP={{ hub_db_backup_keep }}
      ExecStart=/usr/local/sbin/wlb-hub-db-backup

- name: Timer kopii bazy huba (#8)
  ansible.builtin.copy:
    dest: /etc/systemd/system/wlb-hub-db-backup.timer
    mode: "0644"
    content: |
      [Unit]
      Description=WLB: harmonogram spójnej kopii bazy huba (#8)

      [Timer]
      OnBootSec=5min
      OnCalendar={{ hub_db_backup_oncalendar }}
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Włącz timer kopii bazy huba (#8)
  ansible.builtin.systemd_service:
    name: wlb-hub-db-backup.timer
    enabled: true
    daemon_reload: true
