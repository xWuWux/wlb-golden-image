# Stos neuroobrazowania dla flavora wlb-radiologia (#135): FSL (zawiera FSLeyes) + 3DSlicer.
# Licencja FSL: użytek niekomercyjny/akademicki — potwierdzone (#134). Instalacja przy budowaniu
# (VM ma wtedy sieć); gotowy obraz jest offline. OGROMNE pliki — tylko ten flavor, nie baza.

# --- FSL (conda-based; instaluje też FSLeyes) --------------------------------------------
- name: Pobierz instalator FSL
  ansible.builtin.get_url:
    url: "{{ fsl_installer_url }}"
    dest: /tmp/fslinstaller.py
    mode: "0644"
  register: neuro_apps_fsl_dl
  until: neuro_apps_fsl_dl is succeeded
  retries: 3
  delay: 30

# fslinstaller z -V <wersja> -d <katalog> działa nieinteraktywnie. Pierwsze budowanie bardzo długie
# i pobiera dziesiątki GB (miniconda + FSL). Instalator SAM pobiera miniconda z manifestu — NIE podajemy
# --miniconda: ta flaga oczekuje URL/pliku instalatora miniconda ALBO istniejącego katalogu conda
# (op.isdir), a podana ścieżka temp była traktowana jak URL ("unknown url type") i wywracała build (#135).
- name: Instalacja FSL (długie, duże) do {{ fsl_dir }}
  ansible.builtin.command: >-
    python3 /tmp/fslinstaller.py -V {{ fsl_version }} -d {{ fsl_dir }}
  args:
    creates: "{{ fsl_dir }}/etc/fslversion"
  changed_when: true

- name: Środowisko FSL (FSLDIR + PATH) dla wszystkich użytkowników
  ansible.builtin.copy:
    dest: /etc/profile.d/fsl.sh
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola neuro_apps) — #135
      FSLDIR={{ fsl_dir }}
      export FSLDIR
      [ -r "${FSLDIR}/etc/fslconf/fsl.sh" ] && . "${FSLDIR}/etc/fslconf/fsl.sh"
      PATH="${FSLDIR}/share/fsl/bin:${PATH}"
      export PATH

- name: Sprzątanie po instalacji FSL
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/fslinstaller.py

# --- 3DSlicer (tarball Linux; GUI — wymaga pulpitu z roli desktop) ------------------------
# Biblioteki systemowe platformy Qt "xcb". Tarball 3DSlicer wnosi własne Qt5 (w swoim lib/), ale
# wtyczka platformy libqxcb.so linkuje do systemowych bibliotek XCB, których XFCE z roli desktop nie
# wciąga. Bez nich Slicer NIE startuje: "libxcb-icccm.so.4: cannot open shared object file" (#135, #4).
# Potwierdzone ldd wtyczki platforms/libqxcb.so na zbudowanym obrazie — to pełny komplet brakujących.
- name: Biblioteki platformy Qt xcb wymagane przez 3DSlicer (#4)
  ansible.builtin.apt:
    update_cache: true
    name:
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0
    state: present

- name: Pobierz 3DSlicer (tarball, weryfikacja SHA-512)
  ansible.builtin.get_url:
    url: "{{ slicer_url }}"
    dest: /tmp/slicer.tar.gz
    checksum: "sha512:{{ slicer_sha512 }}"
    mode: "0644"
  register: neuro_apps_slicer_dl
  until: neuro_apps_slicer_dl is succeeded
  retries: 3
  delay: 30

- name: Rozpakuj 3DSlicer do {{ slicer_prefix }}
  ansible.builtin.unarchive:
    src: /tmp/slicer.tar.gz
    remote_src: true
    dest: "{{ slicer_prefix }}"
    creates: "{{ slicer_prefix }}/Slicer-{{ slicer_version }}-linux-amd64/Slicer"

- name: 3DSlicer na PATH (symlink)
  ansible.builtin.file:
    src: "{{ slicer_prefix }}/Slicer-{{ slicer_version }}-linux-amd64/Slicer"
    dest: /usr/local/bin/Slicer
    state: link

- name: Sprzątanie tarballa 3DSlicer
  ansible.builtin.file:
    path: /tmp/slicer.tar.gz
    state: absent

# --- Kafelki pulpitu / menu XFCE (#135) --------------------------------------------------
# Flavor radiologia ma pulpit (rola desktop). Badacz dostaje w menu Aplikacje klikalne kafelki
# FSLeyes / FSL / 3DSlicer zamiast uruchamiania z terminala. Ikony kopiujemy do stabilnego
# /usr/share/pixmaps (ścieżki w drzewie FSL/Slicer są wersjozależne). FSLeyes i FSL wymagają
# FSLDIR — kafelek źródłuje /etc/profile.d/fsl.sh przed uruchomieniem; Slicer jest samowystarczalny.
- name: Katalog na ikony kafelków
  ansible.builtin.file:
    path: /usr/share/pixmaps
    state: directory
    mode: "0755"

- name: Ikona 3DSlicer do /usr/share/pixmaps
  ansible.builtin.copy:
    src: "{{ slicer_prefix }}/Slicer-{{ slicer_version }}-linux-amd64/Slicer.png"
    dest: /usr/share/pixmaps/slicer.png
    remote_src: true
    mode: "0644"

- name: Znajdź ikonę FSLeyes (ścieżka zależna od wersji Pythona w FSL)
  ansible.builtin.find:
    paths: "{{ fsl_dir }}/lib"
    patterns: fsleyes.png
    recurse: true
    file_type: file
  register: neuro_apps_fsleyes_icon

- name: Ikona FSLeyes do /usr/share/pixmaps (stabilna ścieżka dla kafelka)
  vars:
    fsleyes_app_icon: "{{ neuro_apps_fsleyes_icon.files | map(attribute='path') | select('search', 'hicolor/48x48/apps/fsleyes.png') | list }}"
  ansible.builtin.copy:
    src: "{{ fsleyes_app_icon[0] }}"
    dest: /usr/share/pixmaps/fsleyes.png
    remote_src: true
    mode: "0644"
  when: fsleyes_app_icon | length > 0

# FSLeyes/FSL wymagają FSLDIR — opakowujemy je skryptem, który źródłuje profile.d/fsl.sh i wywołuje
# narzędzie. Dzięki temu Exec kafelka jest prosty (bez zagnieżdżonego "sh -c", którego nie przepuszcza
# desktop-file-validate: ';', '$', apostrof to znaki zarezerwowane w kluczu Exec).
- name: Skrypt opakowujący FSLeyes (źródłuje FSLDIR)
  ansible.builtin.copy:
    dest: /usr/local/bin/wlb-fsleyes
    mode: "0755"
    content: |
      #!/bin/sh
      # Zarządzane przez Ansible (rola neuro_apps) — #135
      . /etc/profile.d/fsl.sh
      exec fsleyes "$@"

- name: Skrypt opakowujący menu FSL (źródłuje FSLDIR)
  ansible.builtin.copy:
    dest: /usr/local/bin/wlb-fsl
    mode: "0755"
    content: |
      #!/bin/sh
      # Zarządzane przez Ansible (rola neuro_apps) — #135
      . /etc/profile.d/fsl.sh
      exec fsl "$@"

- name: Kafelek FSLeyes (menu XFCE)
  ansible.builtin.copy:
    dest: /usr/share/applications/wlb-fsleyes.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=FSLeyes
      GenericName=Przeglądarka obrazów neuro
      Comment=Przeglądarka obrazów neuroobrazowych (FSL)
      Exec=wlb-fsleyes %F
      Icon=fsleyes
      Terminal=false
      StartupNotify=true
      Categories=Science;MedicalSoftware;
      Keywords=FSL;MRI;fMRI;NIfTI;neuro;

- name: Kafelek FSL (menu XFCE)
  ansible.builtin.copy:
    dest: /usr/share/applications/wlb-fsl.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=FSL
      GenericName=Narzędzia neuroobrazowania
      Comment=Menu narzędzi FSL (FLIRT, FEAT, BET, FSLeyes…)
      Exec=wlb-fsl
      Icon=fsleyes
      Terminal=false
      StartupNotify=true
      Categories=Science;MedicalSoftware;
      Keywords=FSL;MRI;fMRI;FLIRT;FEAT;BET;neuro;

- name: Kafelek 3DSlicer (menu XFCE)
  ansible.builtin.copy:
    dest: /usr/share/applications/wlb-slicer.desktop
    mode: "0644"
    content: |
      [Desktop Entry]
      Type=Application
      Version=1.0
      Name=3D Slicer
      GenericName=Analiza i wizualizacja obrazów medycznych
      Comment=Platforma do analizy i wizualizacji obrazów medycznych (3D Slicer)
      Exec=/usr/local/bin/Slicer %F
      Icon=slicer
      Terminal=false
      StartupNotify=true
      Categories=Science;MedicalSoftware;
      Keywords=Slicer;DICOM;MRI;CT;segmentacja;neuro;
