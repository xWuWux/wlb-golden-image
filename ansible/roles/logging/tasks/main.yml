# Wszystko (JupyterHub, audyt, śluzy, powłoka) trafia do journald -> rsyslog.
# Przekazywanie do centralnego SIEM konfiguruje wlb-firstboot (SIEM_HOST w lab.env).
- name: Katalog konfiguracji journald
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Journald — trwałe logi i przekazywanie do rsyslog
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-wlb.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola logging)
      [Journal]
      Storage=persistent
      ForwardToSyslog=yes
      SystemMaxUse=2G
  notify: Restart journald

# Pola zaufane: rsyslog dopisuje do każdego wpisu z gniazda systemowego uid/gid/pid nadawcy odczytane
# z jądra (SCM_CREDENTIALS; journald przekazuje dane uwierzytelniające pierwotnego procesu). Treść
# i tag wpisu może podać każdy proces (np. logger z dowolnym tagiem), tych pól — nie. Na nich SIEM odróżnia
# zdarzenie usługi systemowej od wpisu podrobionego przez badacza (#44, observability/contract.yml).
# ParseTrusted czyta też nazwę i wiersz poleceń nadawcy każdego wpisu z /proc. Profil AppArmor rsyslogd
# z Ubuntu tego nie zezwala, a każda odmowa to zdarzenie audytu, które audisp-syslog wysyła z powrotem
# do rsyslog — pętla, która zalewa audyt i gubi prawdziwe zdarzenia ("backlog limit exceeded").
- name: AppArmor rsyslogd — odczyt danych nadawcy z /proc (pola zaufane)
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.sbin.rsyslogd
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola logging). imuxsock z ParseTrusted (#44): comm i cmdline nadawcy.
      @{PROC}/[0-9]*/comm r,
      @{PROC}/[0-9]*/cmdline r,
  notify:
    - Reload AppArmor rsyslogd
    - Restart rsyslog

- name: Rsyslog — pola zaufane nadawcy (imuxsock)
  ansible.builtin.replace:
    path: /etc/rsyslog.conf
    regexp: '^module\(load="imuxsock"\)'
    replace: 'module(load="imuxsock" SysSock.Annotate="on" SysSock.ParseTrusted="on")'
  notify: Restart rsyslog

- name: Rsyslog — pola zaufane włączone
  ansible.builtin.command: grep -q 'SysSock.ParseTrusted="on"' /etc/rsyslog.conf
  changed_when: false

- name: Rejestrowanie poleceń powłoki badaczy
  ansible.builtin.template:
    src: wlb-shell-audit.sh.j2
    dest: /etc/profile.d/wlb-shell-audit.sh
    mode: "0644"

# Terminal w JupyterLab to interaktywny bash bez logowania — czyta bash.bashrc, nie profile.d
- name: Rejestrowanie także w powłokach bez logowania
  ansible.builtin.lineinfile:
    path: /etc/bash.bashrc
    line: "[ -r /etc/profile.d/wlb-shell-audit.sh ] && . /etc/profile.d/wlb-shell-audit.sh"
