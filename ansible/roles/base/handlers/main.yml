- name: Restart ssh
  # /run/sshd (tmpfs, tworzony przez ssh.service/tmpfiles przy starcie) bywa nieobecny w trakcie
  # provisioningu — sshd -t bez niego zwraca „Missing privilege separation directory" i wywala build.
  ansible.builtin.shell: install -d -m 0755 /run/sshd && sshd -t && systemctl restart ssh
  changed_when: true

- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
