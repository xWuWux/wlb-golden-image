# apt ponawia pobieranie paczek przy przejściowych błędach sieci/mirrorów
- name: Ponawianie pobierania w apt
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80-wlb-retries
    mode: "0644"
    content: |
      // Zarządzane przez Ansible (rola base)
      Acquire::Retries "5";

- name: Aktualizacja systemu (stan z dnia budowania — VM nie aktualizuje się sama)
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist

# Gdy dist-upgrade wciągnął nowe jądro, maszyna budująca działa nadal na starym. Restart przełącza
# ją na jądro docelowe, dzięki czemu reszta budowania (TLJH, R, GPU) i czyszczenie (cleanup.sh) działają
# na właściwym jądrze, a stare da się usunąć (purge działającego jądra jest blokowany). Moduł reboot
# sam odnawia połączenie SSH — nie trzeba dzielić provisionera ani używać expect_disconnect w Packerze.
- name: Czy aktualizacja wymaga restartu
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: base_reboot_required

- name: Restart maszyny budującej na jądro docelowe (#9)
  ansible.builtin.reboot:
    reboot_timeout: 600
  when: base_reboot_required.stat.exists

- name: Pakiety bazowe
  ansible.builtin.apt:
    name:
      - acl
      - apparmor-utils # aa-status / aa-enforce w diagnostyce i utwardzeniu (CIS 1.6, #65)
      - auditd
      - audispd-plugins
      - build-essential
      - ca-certificates
      - ceph-common
      - chrony
      - curl
      - git
      - inotify-tools
      - jq
      - locales
      - lynis # skan utwardzenia (CIS/hardening) jako raport w etapie 5 (#11)
      - nfs-common
      - nftables
      - psmisc
      - python3
      - python3-dev
      - python3-venv
      - qemu-guest-agent
      - rsyslog
      - rsyslog-gnutls # moduł lmnsd_gtls: TLS do SIEM (#6)
      - sqlite3 # spójna kopia bazy huba: sqlite3 .backup (#8)
      - unzip
    state: present

# Aktualizacje wchodzą wyłącznie przez nową wersję obrazu; VM i tak nie ma wyjścia do archiwów Ubuntu.
# apport (automatyczny crash-reporter) przy starcie ustawia fs.suid_dumpable=2, niwecząc nasz sysctl=0
# (#63), a do tego przechwytuje zrzuty pamięci, które świadomie wyłączamy — w obrazie zbędny i ryzykowny.
- name: Usunięcie unattended-upgrades, snapd i apport
  ansible.builtin.apt:
    name: [unattended-upgrades, snapd, apport]
    state: absent
    purge: true

- name: Strefa czasowa
  ansible.builtin.command: timedatectl set-timezone {{ wlb_timezone }}
  changed_when: true

- name: Locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: "^#? *{{ item }} "
    line: "{{ item }} UTF-8"
  loop: "{{ wlb_locales }}"
  notify: Generate locales

- name: Usługi bazowe
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop: [chrony, qemu-guest-agent, rsyslog, auditd]

# VM Laboratorium nie ma dostępu do internetu — publiczne serwery NTP z konfiguracji Ubuntu
# są nieosiągalne. Źródła czasu ustawia wlb-firstboot z NTP_SERVERS (lab.env) w sources.d. #5
- name: Chrony bez publicznych serwerów NTP
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: "^(pool|server) "
    state: absent

- name: Chrony czyta źródła z /etc/chrony/sources.d
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    line: sourcedir /etc/chrony/sources.d

- name: Grupa administratorów platformy (dostęp SSH)
  ansible.builtin.group:
    name: "{{ wlb_platform_admin_group }}"
    system: true

# Bez tego AllowGroups odciąłby Packera w trakcie budowania; użytkownik "packer" znika przy wyłączeniu.
- name: Użytkownik budujący w grupie SSH
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: "{{ wlb_platform_admin_group }}"
    append: true

- name: Utwardzenie SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-wlb.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola base)
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AllowGroups {{ wlb_platform_admin_group }}
      X11Forwarding no
      AllowTcpForwarding no
      AllowAgentForwarding no
      PermitTunnel no
      ClientAliveInterval 300
      # CIS 5.2: ograniczenie brute force i logowania, pełniejszy log, banner (#62)
      MaxAuthTries 4
      LoginGraceTime 60
      MaxSessions 4
      MaxStartups 10:30:60
      LogLevel VERBOSE
      PermitUserEnvironment no
      Banner /etc/issue.net
  notify: Restart ssh

# Komunikat prawny o monitoringu (§21 Regulaminu) — przed uwierzytelnieniem (issue.net) i na konsoli
# (issue). Zastępuje domyślny baner Ubuntu, który ujawniał wersję systemu (CIS banner_etc_issue). #62
- name: Komunikat prawny logowania (/etc/issue, /etc/issue.net)
  ansible.builtin.copy:
    src: wlb-issue
    dest: "{{ item }}"
    mode: "0644"
  loop:
    - /etc/issue
    - /etc/issue.net

# --- Ochrona usług systemowych przed OOM killerem (#30) ----------------------------------
# Przy braku pamięci jądro zabija najpierw procesy badaczy (OOMScoreAdjust=500 w ich jednostkach,
# rola tljh), a usługi audytu, logów, huba i dostępu — na końcu. Audyt nigdy (-1000), bo przerwa
# w audycie narusza §21. MemoryMin pominięte: ochrona memory.min działa tylko wtedy, gdy mają ją też
# wszystkie nadrzędne slice (system.slice) — główną rezerwę daje limit slice badaczy (wlb-firstboot).
# Bez ssh: sshd sam ustawia procesowi nasłuchującemu -1000 (SSHD_OOM_ADJUST), a sesjom przywraca
# wartość jednostki — drop-in chroniłby tylko sesje administratorów i wszystko, co w nich uruchomią.
# Drop-iny działają od następnego startu usług (VM z obrazu startuje od zera).
- name: Katalogi drop-in usług chronionych przed OOM
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    mode: "0755"
  loop: [auditd.service, rsyslog.service, jupyterhub.service, traefik.service, wlb-sluza-out.service]

- name: Usługi systemowe chronione przed OOM killerem
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.unit }}.d/50-wlb-oom.conf"
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola base) — #30
      [Service]
      OOMScoreAdjust={{ item.score }}
  loop:
    - { unit: auditd.service, score: -1000 }
    - { unit: rsyslog.service, score: -900 }
    - { unit: jupyterhub.service, score: -900 }
    - { unit: traefik.service, score: -900 }
    - { unit: wlb-sluza-out.service, score: -900 }
  loop_control:
    label: "{{ item.unit }}"
  notify: Reload systemd

- name: Utwardzenie jądra
  ansible.builtin.copy:
    dest: /etc/sysctl.d/60-wlb.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola base)
      kernel.dmesg_restrict = 1
      kernel.kptr_restrict = 2
      kernel.yama.ptrace_scope = 1
      net.ipv4.ip_forward = 0
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.default.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.default.send_redirects = 0
      # Reverse path filter, brak source routing, brak secure redirects, log marsjańskich adresów (CIS 3.x, #63).
      # VM nie jest routerem ani nie przekazuje ruchu — to standardowe wzmocnienia bez wpływu na pracę badaczy.
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv4.conf.default.accept_source_route = 0
      net.ipv4.conf.all.secure_redirects = 0
      net.ipv4.conf.default.secure_redirects = 0
      # log_martians zwiększa liczbę wpisów w dzienniku — do obserwacji przy przepełnieniu kolejki SIEM (#32)
      net.ipv4.conf.all.log_martians = 1
      net.ipv4.conf.default.log_martians = 1
      net.ipv4.tcp_syncookies = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1
      net.ipv4.icmp_ignore_bogus_error_responses = 1
      # IPv6: brak autoconfiguracji (RA), forwardingu i source routing (CIS 3.x, #63)
      net.ipv6.conf.all.accept_ra = 0
      net.ipv6.conf.default.accept_ra = 0
      net.ipv6.conf.all.forwarding = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv6.conf.default.accept_source_route = 0
      # dowiązania w katalogach współdzielonych (śluza wyjściowa, #29) — wartości domyślne Ubuntu, przypięte jawnie
      fs.protected_hardlinks = 1
      fs.protected_symlinks = 1
      fs.protected_fifos = 2
      fs.protected_regular = 2
      # zrzuty pamięci programów z bitem suid wyłączone (CIS 1.5.1, #63)
      fs.suid_dumpable = 0
  notify: Apply sysctl

# AppArmor jest w Ubuntu 24.04 domyślnie włączony, ale profil CIS L1 sprawdza jawny wpis w cmdline jądra
# (grub2_enable_apparmor, #65). Drop-in /etc/default/grub.d/ jest sourcowany po /etc/default/grub, więc
# dokłada parametry bez nadpisywania istniejących.
#
# Prefiks 60-, nie 50-: obok naszego pliku w obrazach Ubuntu bywa 50-cloudimg-settings.cfg, z którym
# 50-wlb-apparmor.cfg startowało do alfabetycznego wyścigu o GRUB_CMDLINE_LINUX_DEFAULT (zgłoszenie 65).
- name: AppArmor wymuszony w parametrach jądra GRUB (#65, CIS 1.6)
  ansible.builtin.copy:
    dest: /etc/default/grub.d/60-wlb-apparmor.cfg
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola base) — CIS 1.6, #65
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT apparmor=1 security=apparmor"

# Nazwa pliku zmieniła się z 50- na 60- — stary drop-in zostałby sourcowany na zawsze i podwajał parametry.
- name: Usunięcie starego dropina GRUB z prefiksem 50- (#65)
  ansible.builtin.file:
    path: /etc/default/grub.d/50-wlb-apparmor.cfg
    state: absent

# Bezwarunkowe (nie handlerowe) przeładowanie GRUB: handler nie odpala przy re-runie, gdy drop-in nie
# zmienił treści, a w procesie budowy obrazu menu musi na pewno odpowiadać parametrom z pliku (zgłoszenie 65).
- name: Przeładowanie GRUB (#65) — gwarancja parametrów AppArmor w obrazie
  ansible.builtin.command: update-grub
  changed_when: true

# Profile dystrybucyjne (m.in. transmission z bazowego pakietu `apparmor`) Ubuntu ładowuje w trybie
# complain, przez co CIS 1.6.3 („żaden profil w complain") pada na profilach aplikacji, których w obrazie
# nie ma (#65).
#
# Naprawa jest celowo wąska: przełączamy WYŁĄCZNIE profile wskazane jako complaining, a nie cały katalog
# (`aa-enforce --recursive /etc/apparmor.d/`). Rekurencyjne aa-enforce dotknęłoby też ~90 profili
# oznaczonych przez dystrybucję jako unconfined (Discord, brave, 1password) — to inny tryb, jego zmiana
# nie jest wymagana przez CIS 1.6.3, a skutku nie da się sprawdzić bez żywej VM (po stronie kontrolującej
# brak apparmor-utils i zamontowanego apparmorfs). Nazwy bierzemy z `aa-status --json` (kształt nieznany
# zdalnie — przechodzimy całe drzewo JSON), z fallbackiem do `aa-status --verbose`; po naprawie
# twardo assertujemy, ze licznik spadl do zera — wolimy glosna porazke builda niz FAIL w etapie 5.
- name: Profile AppArmor z trybu complain przełączone na enforce (#65, CIS 1.6.3)
  ansible.builtin.shell: |
    set -o pipefail
    before=$(aa-status --complaining)
    if [[ ! $before =~ ^[0-9]+$ ]]; then
      echo "BŁĄD (#65): aa-status --complaining zwróciło '${before}' — nie znam liczby profili w complain" >&2
      exit 1
    fi
    if ((before == 0)); then
      echo "aa-status --complaining=0 — brak profili do przełączenia (CIS 1.6.3, #65)"
      echo "WLB_SWITCHED=0"
      exit 0
    fi
    # Nazwy profili w complain: przechodzimy cale drzewo json i bierzemy wartesci/klucze spod kazdego
    # klucza zawierajacego "complain"; jesli aa-status nie zna --json — lista z `--verbose`.
    names=$(aa-status --json 2>/dev/null | python3 -c '
    import json,sys
    try: d=json.load(sys.stdin)
    except Exception: sys.exit()
    def walk(x):
      if isinstance(x,dict):
        for k,v in x.items():
          if "complain" in str(k).lower():
            if isinstance(v,dict): yield from v.keys()
            elif isinstance(v,list):
              for i in v:
                if isinstance(i,str): yield i
                elif isinstance(i,dict): yield i.get("name") or i.get("profile") or ""
          yield from walk(v)
      elif isinstance(x,list):
        for i in x:
          if isinstance(i,str): yield i
          else: yield from walk(i)
    def modes(x):
      # ksztalt "[{name, mode: complain}]" — nazwa przy wartosci trybu, nie w kluczu
      if isinstance(x,dict):
        if str(x.get("mode","")).lower().startswith("complain"): yield x.get("name") or x.get("profile") or ""
        for v in x.values(): yield from modes(v)
      elif isinstance(x,list):
        for i in x: yield from modes(i)
    out={s for s in walk(d) if s} | {s for s in modes(d) if s}
    for n in sorted(out): print(n)
    ')
    if [[ -z ${names//[[:space:]]/} ]]; then
      names=$(aa-status --verbose 2>/dev/null | sed -n 's/^[[:space:]]*\(.*[^[:space:]]\)[[:space:]].*complain mode.*$/\1/p' | sort -u)
    fi
    if [[ -z ${names//[[:space:]]/} ]]; then
      echo "BŁĄD (#65): $before profili w complain, ale nie umiem odczytac ich nazw — nie zgaduje" >&2
      aa-status --verbose 2>/dev/null | grep -i "complain mode" >&2 || true
      exit 1
    fi
    # nazwy profili nie zawieraja spacji — rozbicie na slowa jest celowe (petla ponizej)
    # shellcheck disable=SC2086
    echo "Profile w trybie complain (before=$before): $(printf '%s ' $names)"
    for p in $names; do
      if aa-enforce "$p"; then
        echo "  aa-enforce $p: OK (nazwa profilu)"
      elif [[ -f /etc/apparmor.d/$p ]] && aa-enforce "/etc/apparmor.d/$p"; then
        echo "  aa-enforce /etc/apparmor.d/$p: OK (sciezka)"
      else
        echo "UWAGA: aa-enforce nie przełączył profilu '$p' — stan zweryfikuje licznik ponizej" >&2
      fi
    done
    after=$(aa-status --complaining)
    echo "aa-status --complaining: before=$before after=$after"
    if [[ $after != 0 ]]; then
      echo "BŁĄD (#65): po aa-enforce nadal $after profili w trybie complain — test akceptacyjny padnie" >&2
      aa-status --verbose 2>/dev/null | grep -i "complain mode" >&2 || true
      exit 1
    fi
    echo "WLB_SWITCHED=1"
  args:
    executable: /bin/bash
  register: base_complain_enforce
  # Zmiana tylko gdy coś faktycznie przełączaliśmy (before>0); przy before=0 zadanie jest no-opem.
  changed_when: "'WLB_SWITCHED=1' in base_complain_enforce.stdout"

# Zrzuty pamięci użytkowników wyłączone (CIS 1.5.1, #63): twardy limit core=0 (limits) i brak zapisu
# przez systemd-coredump. Zapobiega wyciekowi wrażliwych danych z pamięci do plików core w Laboratorium.
- name: Wyłączenie zrzutów pamięci użytkowników (limits)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/60-wlb-coredump.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola base) — CIS 1.5.1, #63
      * hard core 0

- name: Katalog drop-in systemd-coredump
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    mode: "0755"

- name: Wyłączenie zapisu zrzutów pamięci przez systemd-coredump
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/60-wlb.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola base) — CIS 1.5.1, #63
      [Coredump]
      Storage=none
      ProcessSizeMax=0
  notify: Reload systemd
- name: Katalogi konfiguracyjne WLB
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: [/etc/wlb, /opt/wlb, /opt/wlb/envs]
