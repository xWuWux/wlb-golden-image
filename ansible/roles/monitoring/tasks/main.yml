# Pakiet domyślnie nasłuchuje na wszystkich interfejsach. Drop-in powstaje przed instalacją,
# a policy_rc_d blokuje automatyczny start podczas instalacji.
- name: Katalog konfiguracji node_exporter
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    mode: "0755"

- name: Lokalny nasłuch node_exporter (#22)
  ansible.builtin.copy:
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/10-wlb.conf
    mode: "0644"
    # --no-collector.systemd: pakiet Debiana włącza kolektor systemd, który wypisuje stan KAŻDEJ
    # jednostki — w tym jupyter-<login>.service badaczy (etap 5 wykrył to w pełnej odpowiedzi, #22).
    # Flagi kolektorów w Environment, a w ExecStart tylko adres nasłuchu: wlb-monitoring podmienia
    # wyłącznie adres, a kolektory pozostają jedną definicją z obrazu.
    content: |
      [Service]
      Environment="WLB_NODE_EXPORTER_FLAGS=--collector.textfile.directory=/var/lib/wlb-node-exporter --no-collector.systemd"
      ExecStart=
      ExecStart=/usr/bin/prometheus-node-exporter --web.listen-address=127.0.0.1:9100 $WLB_NODE_EXPORTER_FLAGS
  notify: Restart node exporter

- name: Katalog metryk textfile
  ansible.builtin.file:
    path: /var/lib/wlb-node-exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Katalog reguł zapory dla ekspozycji metryk (#22)
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Narzędzie włączania/wyłączania ekspozycji metryk (#22)
  ansible.builtin.copy:
    src: wlb-monitoring
    dest: /usr/local/sbin/wlb-monitoring
    owner: root
    group: root
    mode: "0755"

- name: Instalacja node_exporter bez automatycznego startu
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    install_recommends: false
    policy_rc_d: 101

- name: Uruchomienie node_exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter.service
    daemon_reload: true
    enabled: true
    state: started

- name: Kolektor zagregowanego stanu WLB (#22)
  ansible.builtin.copy:
    src: wlb-health
    dest: /usr/local/sbin/wlb-health
    owner: root
    group: root
    mode: "0755"

- name: Jednostki kolektora stanu WLB
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - wlb-health.service
    - wlb-health.timer
  notify: Restart wlb health timer

- name: Uruchom cykliczny kolektor stanu WLB
  ansible.builtin.systemd:
    name: wlb-health.timer
    enabled: true
    state: started
    daemon_reload: true
