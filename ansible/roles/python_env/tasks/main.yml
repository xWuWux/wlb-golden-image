- name: Wybór pliku środowiska (lock ma pierwszeństwo)
  ansible.builtin.set_fact:
    python_env_src: "{{ python_env_lock_file if python_env_lock_file is file else python_env_file }}"

- name: Katalog środowiska Python
  ansible.builtin.file:
    path: /opt/wlb/envs/python
    state: directory
    mode: "0755"

- name: Skopiuj definicję środowiska
  ansible.builtin.copy:
    src: "{{ python_env_src }}"
    dest: /opt/wlb/envs/python/environment.yml
    mode: "0644"

- name: Instalacja pakietów w środowisku użytkowników TLJH ({{ python_env_src | basename }})
  ansible.builtin.command: >-
    /opt/tljh/user/bin/conda env update
    --prefix /opt/tljh/user
    --file /opt/wlb/envs/python/environment.yml
  environment:
    # conda sama ponawia pobieranie pojedynczych paczek (HTTP 000/5xx z conda.anaconda.org)
    CONDA_REMOTE_MAX_RETRIES: "5"
    CONDA_REMOTE_BACKOFF_FACTOR: "3"
  register: python_env_update
  until: python_env_update is succeeded
  retries: 3
  delay: 30
  changed_when: true

# #179: TLJH/pip pozostawił dist-info 2.14.2 obok wersji 2.14.1 z conda.
# Nie zmieniamy locka ani kodu pakietu. Niejednoznaczna własność zatrzymuje build.
- name: Skopiuj narzędzie porządkowania metadanych pydantic
  ansible.builtin.copy:
    src: reconcile_pydantic.py
    dest: /opt/wlb/envs/python/reconcile_pydantic.py
    mode: "0644"

- name: Odizoluj nieaktualne metadane pydantic przed eksportem
  ansible.builtin.command:
    argv:
      - /opt/tljh/user/bin/python
      - /opt/wlb/envs/python/reconcile_pydantic.py
      - /opt/wlb/envs/python/stale-metadata
  register: python_env_metadata
  changed_when: (python_env_metadata.stdout | from_json).changed

- name: Pokaż wynik porządkowania metadanych
  ansible.builtin.debug:
    var: python_env_metadata.stdout

- name: Zamrożenie wersji (conda env export)
  ansible.builtin.shell: |
    set -o pipefail
    /opt/tljh/user/bin/conda env export --prefix /opt/tljh/user --no-builds \
      | grep -v '^prefix:' > /opt/wlb/envs/python/environment.lock.yml
  args:
    executable: /bin/bash
  changed_when: true

- name: Zapisz przebieg instalacji środowiska (diagnostyka migracji menedżerów pakietów)
  ansible.builtin.copy:
    content: |
      # {{ python_env_update.cmd | default('conda env update') }}
      # rc={{ python_env_update.rc | default('?') }} (proba {{ python_env_update.attempts | default(1) }})
      {{ python_env_update.stdout_lines[-2000:] | join('\n') }}
      --- stderr ---
      {{ python_env_update.stderr_lines[-500:] | join('\n') }}
    dest: /opt/wlb/envs/python/conda-env-update.log
    mode: "0644"

- name: Pobierz lock do artefaktów budowania
  ansible.builtin.fetch:
    src: /opt/wlb/envs/python/environment.lock.yml
    dest: "{{ wlb_artifacts_dir }}/environment.lock.yml"
    flat: true

- name: Pobierz przebieg instalacji do artefaktów budowania
  ansible.builtin.fetch:
    src: /opt/wlb/envs/python/conda-env-update.log
    dest: "{{ wlb_artifacts_dir }}/conda-env-update.log"
    flat: true

# M0 (#193) dotyczy WYŁĄCZNIE nowo budowanego obrazu, nie działającej VM badacza.
# TLJH instaluje swój prefiks pod /opt/tljh/user; zwykłe mv nie relokuje conda.
# Klon używa mechanizmu conda i docelowego prefiksu; przed publikacją weryfikujemy importy.
- name: Przygotuj wersjonowany prefiks Pythona w budowanym obrazie (#193)
  when: wlb_prepare_versioned_python | default(false) | bool
  block:
    - name: Sprawdź status huba przed migracją podczas budowy
      ansible.builtin.command: systemctl is-active --quiet jupyterhub.service
      register: python_env_hub_active
      changed_when: false
      failed_when: python_env_hub_active.rc not in [0, 3, 4]

    - name: Zatrzymaj hub podczas przygotowania prefiksu obrazu
      ansible.builtin.systemd:
        name: jupyterhub.service
        state: stopped
      when: python_env_hub_active.rc == 0

    - name: Klonuj środowisko i przygotuj dowiązanie
      block:
        - name: Skopiuj narzędzie przygotowania prefiksu
          ansible.builtin.copy:
            src: wlb-version-python-env
            dest: /opt/wlb/bin/wlb-version-python-env
            mode: "0755"

        - name: Sprawdź istniejące dowiązanie
          ansible.builtin.stat:
            path: /opt/tljh/user
            follow: false
          register: python_env_user_before

        - name: Przygotuj klon conda w prefiksie wersjonowanym
          ansible.builtin.command:
            argv:
              - /opt/wlb/bin/wlb-version-python-env
              - --version
              - "{{ wlb_image_version }}"
          changed_when: not (python_env_user_before.stat.islnk | default(false))
      always:
        - name: Przywróć poprzedni stan działania huba po przygotowaniu obrazu
          ansible.builtin.systemd:
            name: jupyterhub.service
            state: started
          when: python_env_hub_active.rc == 0
