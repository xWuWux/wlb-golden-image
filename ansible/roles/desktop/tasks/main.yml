# Pulpit w przeglądarce dla flavora wlb-memory (#106, PoC). Osadzony w JupyterLab przez
# jupyter-remote-desktop-proxy — ten sam wzorzec co RStudio przez jupyter-rsession-proxy:
# logowanie, proxowanie, idle culling i twardy limit 12 h (§9.5) idą przez Hub.
# Rola nakładana warstwowo na gotowy obraz wlb-general (playbook desktop.yml), nie w site.yml bazy.

- name: Pakiety pulpitu (XFCE minimalny, TigerVNC, noVNC, websockify)
  ansible.builtin.apt:
    update_cache: true
    name:
      - xfce4 # sesja + panel + menedżer okien (bez xfce4-goodies — za ciężkie na PoC)
      - xterm # terminal na pulpicie
      - scrot # zrzuty ekranu: narzędzie badacza + zależność render-smoke (tests/desktop-render-smoke.sh, #138)
      - x11-utils # xdpyinfo/xprop/xwininfo/xmessage — gotowość i okno kontrolne render-smoke (#205)
      - wmctrl # przesunięcie/zmiana rozmiaru okna kontrolnego w render-smoke (#205)
      - xauth # ciasteczko X prywatnej sesji render-smoke (wrapper TigerVNC, #205)
      - dbus-x11 # magistrala D-Bus sesji XFCE
      - tigervnc-standalone-server
      - tigervnc-common
      - websockify
      - novnc
    state: present

# Pakiety pulpitu (XFCE jako zależność) wciągają z powrotem apport, który usunęła rola base — a apport
# przy starcie ustawia fs.suid_dumpable=2, niwecząc nasz sysctl=0 (#63). Usuwamy go ponownie w warstwie
# pulpitu (dotyczy obu flavorów z pulpitem: wlb-memory i wlb-radiologia).
- name: Ponowne usunięcie apport wciągniętego przez pakiety pulpitu (#63)
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true

# server-proxy żyje w środowisku użytkowników TLJH (tam, gdzie kernele i rsession-proxy) — kafelek
# "Desktop" pojawia się w Launcherze automatycznie po instalacji pakietu (entry point server-proxy).
# Pulpit startuje JAKO proces potomny serwera badacza → jego cgroup i OOMScoreAdjust (#30).
- name: Instalacja jupyter-remote-desktop-proxy w środowisku użytkowników TLJH
  ansible.builtin.command: /opt/tljh/user/bin/pip install --retries 5 {{ desktop_proxy_spec }}
  register: desktop_proxy_install
  until: desktop_proxy_install is succeeded
  retries: 3
  delay: 30
  changed_when: true

# Ubuntu 24.04 ładuje vncserver-config-mandatory jako Perl, nie listę argumentów.
# Polityka dotyczy wrappera, a nie uruchomienia Xtigervnc bezpośrednio (#106).
- name: TigerVNC bez schowka dla sesji przez wrapper
  ansible.builtin.copy:
    src: vncserver-config-mandatory
    dest: /etc/tigervnc/vncserver-config-mandatory
    mode: "0644"

# Render-smoke pulpitu (#138, etap 1b): wgrywamy skrypt + helper do obrazu, żeby adaptacyjny
# fragment akceptacji (tests/acceptance.d/45-pulpit-render.sh) mógł uruchomić go JAKO badacz na VM.
# Źródło w repo (tests/) pozostaje kanoniczne — tu tylko kopia na obraz, bez duplikacji treści.
- name: Katalog testów runtime na obrazie (#138)
  ansible.builtin.file:
    path: /opt/wlb/tests
    state: directory
    mode: "0755"

- name: Render-smoke pulpitu + helper analizy na obrazie (#138, etap 1b)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tests/{{ item }}"
    dest: "/opt/wlb/tests/{{ item }}"
    mode: "0755"
  loop:
    - desktop-render-smoke.sh
    - desktop_render_smoke.py
