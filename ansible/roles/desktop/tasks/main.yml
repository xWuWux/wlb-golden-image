# Pulpit w przeglądarce dla flavora wlb-memory (#106, PoC). Osadzony w JupyterLab przez
# jupyter-remote-desktop-proxy — ten sam wzorzec co RStudio przez jupyter-rsession-proxy:
# logowanie, proxowanie, idle culling i twardy limit 12 h (§9.5) idą przez Hub.
# Rola nakładana warstwowo na gotowy obraz wlb-general (playbook desktop.yml), nie w site.yml bazy.

- name: Pakiety pulpitu (XFCE minimalny, TigerVNC, noVNC, websockify)
  ansible.builtin.apt:
    update_cache: true
    name:
      - xfce4 # sesja + panel + menedżer okien (bez xfce4-goodies — za ciężkie na PoC)
      - xterm # terminal na pulpicie
      - scrot # zrzuty ekranu: narzędzie badacza + zależność render-smoke (tests/desktop-render-smoke.sh, #138)
      - x11-utils # xdpyinfo/xprop/xwininfo/xmessage — gotowość i okno kontrolne render-smoke (#205)
      - wmctrl # przesunięcie/zmiana rozmiaru okna kontrolnego w render-smoke (#205)
      - xauth # ciasteczko X prywatnej sesji render-smoke (wrapper TigerVNC, #205)
      - dbus-x11 # magistrala D-Bus sesji XFCE
      - tigervnc-standalone-server
      - tigervnc-common
      - websockify
      - novnc
    state: present

# Pakiety pulpitu (XFCE jako zależność) wciągają z powrotem apport, który usunęła rola base — a apport
# przy starcie ustawia fs.suid_dumpable=2, niwecząc nasz sysctl=0 (#63). Usuwamy go ponownie w warstwie
# pulpitu (dotyczy obu flavorów z pulpitem: wlb-memory i wlb-radiologia).
- name: Ponowne usunięcie apport wciągniętego przez pakiety pulpitu (#63)
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true

# server-proxy żyje w środowisku użytkowników TLJH (tam, gdzie kernele i rsession-proxy) — kafelek
# "Desktop" pojawia się w Launcherze automatycznie po instalacji pakietu (entry point server-proxy).
# Pulpit startuje JAKO proces potomny serwera badacza → jego cgroup i OOMScoreAdjust (#30).
- name: Instalacja jupyter-remote-desktop-proxy w środowisku użytkowników TLJH
  ansible.builtin.command: /opt/tljh/user/bin/pip install --retries 5 {{ desktop_proxy_spec }}
  register: desktop_proxy_install
  until: desktop_proxy_install is succeeded
  retries: 3
  delay: 30
  changed_when: true

# Ubuntu 24.04 ładuje vncserver-config-mandatory jako Perl, nie listę argumentów.
# Polityka dotyczy wrappera, a nie uruchomienia Xtigervnc bezpośrednio (#106).
- name: TigerVNC bez schowka dla sesji przez wrapper
  ansible.builtin.copy:
    src: vncserver-config-mandatory
    dest: /etc/tigervnc/vncserver-config-mandatory
    mode: "0644"

# Propagacja autoryzacji X do natywnych apek GUI sesji (#278). Domyślny xstartup jrdp nie
# eksportuje XAUTHORITY do potomków — LibreOffice Calc/Writer padają "no authorization protocol
# specified". Nasz xstartup eksportuje ŻYWY cookie i łańcuchuje do domyślnego jrdp.
- name: Katalog pulpitu WLB (#278)
  ansible.builtin.file:
    path: /opt/wlb/desktop
    state: directory
    mode: "0755"

- name: Skrypt xstartup sesji pulpitu z eksportem XAUTHORITY (#278)
  ansible.builtin.copy:
    src: wlb-desktop-xstartup
    dest: /opt/wlb/desktop/wlb-desktop-xstartup
    mode: "0755"

- name: Wskaż jrdp xstartup WLB przez środowisko sesji badacza (#278)
  ansible.builtin.copy:
    src: 85-wlb-desktop-session.py
    dest: /opt/tljh/config/jupyterhub_config.d/85-wlb-desktop-session.py
    mode: "0644"

# Render-smoke pulpitu (#138, etap 1b): wgrywamy skrypt + helper do obrazu, żeby adaptacyjny
# fragment akceptacji (tests/acceptance.d/45-pulpit-render.sh) mógł uruchomić go JAKO badacz na VM.
# Źródło w repo (tests/) pozostaje kanoniczne — tu tylko kopia na obraz, bez duplikacji treści.
- name: Katalog testów runtime na obrazie (#138)
  ansible.builtin.file:
    path: /opt/wlb/tests
    state: directory
    mode: "0755"

- name: Render-smoke pulpitu + helper analizy na obrazie (#138, etap 1b)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../tests/{{ item }}"
    dest: "/opt/wlb/tests/{{ item }}"
    mode: "0755"
  loop:
    - desktop-render-smoke.sh
    - desktop_render_smoke.py

# --- Kontrakt wizualny pulpitu (#204) -----------------------------------------------
# Wartości tylko z desktop_xfconf/desktop_contract_* w ansible/group_vars/all.yml.
# Ścieżka ikon: stockowe domyślne Ubuntu (Greybird/elementary-xfce-dark) wskazują pakiety
# nieobecne w minimalnym XFCE — kontrakt przypinamy do Adwaita (GTK3 wbudowany + paczka poniżej).
- name: Paczka ikon Adwaita wymagana przez kontrakt wizualny (#204)
  ansible.builtin.apt:
    name: adwaita-icon-theme
    state: present

# xfce4-settings dostarcza /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml jako plik
# konfiguracyjny pakietu; bez dywersji nasza kopia kontraktowa byłaby nadpisywana przy
# aktualizacji pakietu (albo wpadłaby w prompt conffile — nieinteraktywnie: cicha podmiana).
- name: Sprawdz istnienie dywersji systemowego xsettings.xml (#204)
  ansible.builtin.command: dpkg-divert --list /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
  register: desktop_divert_xsettings
  changed_when: false

- name: Dodaj dywersję systemowego xsettings.xml (#204)
  ansible.builtin.command:
    argv:
      - dpkg-divert
      - --add
      - --divert
      - /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml.dpkg-default
      - --local
      - /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml
  when: desktop_divert_xsettings.stdout == ""
  changed_when: true

# template nie tworzy katalogów nadrzędnych — jawnie zakładamy drzewa docelowe.
- name: Katalogi docelowe kontraktu wizualnego (#204)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/wlb
    - /etc/xdg/xfce4/xfconf/xfce-perchannel-xml
    - /etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml

# Systemowe domyślne xfconf (XDG_CONFIG_DIRS) — docierają do wszystkich profili, w tym
# kont badaczy tworzonych useradd -M bez /etc/skel. Świeży profil = te wartości; pliki
# użytkownika (nadpiski badacza) mają priorytet — kontrakt NIE jest egzekwowany siłą (#204).
- name: Systemowe domyślne ustawienia kanałów xfconf wg kontraktu (#204)
  ansible.builtin.template:
    src: xfconf-channel.xml.j2
    dest: "/etc/xdg/xfce4/xfconf/xfce-perchannel-xml/{{ item }}.xml"
    mode: "0644"
  vars:
    channel_name: "{{ item }}"
    channel_data: "{{ desktop_xfconf[item] }}"
  loop: "{{ desktop_xfconf.keys() | list }}"

# /etc/skel dla kont zakładanych z -m (kontrakt świeżego profilu; podwójne źródło nie
# istnieje — te same drzewo desktop_xfconf co powyżej).
- name: Kontrakt wizualny w /etc/skel (konta z useradd -m) (#204)
  ansible.builtin.template:
    src: xfconf-channel.xml.j2
    dest: "/etc/skel/.config/xfce4/xfconf/xfce-perchannel-xml/{{ item }}.xml"
    mode: "0644"
  vars:
    channel_name: "{{ item }}"
    channel_data: "{{ desktop_xfconf[item] }}"
  loop: "{{ desktop_xfconf.keys() | list }}"

- name: Plik kontraktu dla testów akceptacyjnych (#204)
  ansible.builtin.template:
    src: desktop-contract.j2
    dest: /etc/wlb/desktop-contract
    mode: "0644"

- name: Locale domyślna wg kontraktu (#204)
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG={{ desktop_contract_locale }}"
    create: true
    mode: "0644"

# --- AppArmor w warstwie pulpitu (#65, CIS 1.6.3) ------------------------------------
# Rola base wymusza enforce PRZED warstwą flavora — XFCE, TigerVNC, noVNC (i aplikacje GUI dołożone
# w tej roli, np. przyszły LibreOffice Writer z #269) potrafią wnieść nowe profile w complain. Bez
# sweepu licznik `aa-status --complaining` w tests/acceptance.d/20-apparmor.sh nie zejdzie do 0 na
# flavorze z pulpitem. To OSTATNI task roli: po wszystkich apt (także Adwaita z kontraktu wizualnego).
# Logika w skrypcie, nie inline shell — dzięki temu ma testy jednostkowe (tests/unit/
# wlb-apparmor-enforce.bats) i jest uruchamiana także przez akceptację (idempotentnie).
- name: Skrypt wymuszania AppArmor enforce dla warstwy pulpitu (#65)
  ansible.builtin.copy:
    src: wlb-apparmor-enforce
    dest: /usr/local/sbin/wlb-apparmor-enforce
    mode: "0755"

- name: Profile AppArmor w trybie enforce po pakietach pulpitu (#65, CIS 1.6.3)
  ansible.builtin.command: /usr/local/sbin/wlb-apparmor-enforce
  register: desktop_apparmor_enforce
  changed_when: "'WLB_SWITCHED=1' in desktop_apparmor_enforce.stdout"
