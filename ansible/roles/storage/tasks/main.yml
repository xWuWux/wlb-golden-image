- name: Walidacja budżetu śluzy (#149)
  ansible.builtin.assert:
    that:
      - wlb_sluza_memory_max_mb is integer
      - wlb_sluza_memory_high_mb is integer
      - wlb_sluza_tasks_max is integer
      - wlb_sluza_io_weight is integer
      - wlb_sluza_memory_high_mb >= 64
      - wlb_sluza_memory_high_mb < wlb_sluza_memory_max_mb
      - wlb_sluza_memory_max_mb <= 4096
      - wlb_sluza_tasks_max >= 16
      - wlb_sluza_tasks_max <= 512
      - wlb_sluza_io_weight >= 1
      - wlb_sluza_io_weight <= 10000
    fail_msg: "Niepoprawny budżet śluzy; wymagane liczby całkowite i high < max."

# TLJH tworzy użytkowników przez `useradd --create-home`, więc domyślne wartości useradd
# decydują o położeniu i prawach katalogów domowych badaczy.
- name: Katalogi domowe badaczy w /workspace
  ansible.builtin.lineinfile:
    path: /etc/default/useradd
    regexp: "^#? *HOME="
    line: HOME=/workspace

- name: Prawa katalogów domowych i zakres UID badaczy
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#? *{{ item.key }}\\s"
    line: "{{ item.key }}\t\t{{ item.value }}"
  loop:
    - { key: HOME_MODE, value: "0700" }
    - { key: UID_MIN, value: "{{ wlb_researcher_uid_min }}" }
    - { key: UID_MAX, value: "{{ wlb_researcher_uid_max }}" }
    - { key: GID_MIN, value: "{{ wlb_researcher_uid_min }}" }
    - { key: GID_MAX, value: "{{ wlb_researcher_uid_max }}" }
  loop_control:
    label: "{{ item.key }}"

# TLJH tworzy je sam (idempotentnie), ale zwykłym groupadd — dostałyby GID z zakresu badaczy
# i kolidowały z grupami kont badaczy przy ich odtwarzaniu (migracja). Zakładamy je wcześniej jako systemowe.
- name: Grupy huba jako systemowe (poza zakresem GID badaczy)
  ansible.builtin.group:
    name: "{{ item }}"
    system: true
  loop:
    - "{{ wlb_researcher_group }}"
    - jupyterhub-admins

- name: Katalogi Laboratorium (§10 Regulaminu)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ wlb_directories }}"
  loop_control:
    label: "{{ item.path }}"

# wlb-firstboot odtwarza te prawa po zamontowaniu udziałów sieciowych
- name: Lista katalogów dla wlb-firstboot
  ansible.builtin.copy:
    dest: /etc/wlb/directories.conf
    mode: "0644"
    content: |
      # Zarządzane przez Ansible (rola storage). Format: ścieżka właściciel grupa tryb
      {% for d in wlb_directories %}
      {{ d.path }} {{ d.owner }} {{ d.group }} {{ d.mode }}
      {% endfor %}

- name: Kolejka eksportu (niewidoczna dla badaczy)
  ansible.builtin.file:
    path: "{{ wlb_export_queue_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Dokumentacja dla badaczy w /docs (w produkcji przykrywana przez udział sieciowy)
  ansible.builtin.copy:
    src: docs-README.md
    dest: /docs/README.md
    mode: "0644"

- name: Skrypt przenoszący pliki ze śluzy wyjściowej do kolejki
  ansible.builtin.copy:
    src: wlb-sluza-out-mover
    dest: /usr/local/sbin/wlb-sluza-out-mover
    mode: "0750"

- name: Pomocnik prywatnych kopii i manifestów eksportu (#20)
  ansible.builtin.copy:
    src: wlb-export-snapshot
    dest: /usr/local/sbin/wlb-export-snapshot
    mode: "0750"

- name: Usługa śluzy wyjściowej
  ansible.builtin.copy:
    dest: /etc/systemd/system/wlb-sluza-out.service
    mode: "0644"
    content: |
      [Unit]
      Description=WLB: przenoszenie plików z /sluza-out do kolejki zatwierdzenia eksportu
      After=local-fs.target remote-fs.target
      # kolejka leży na dysku roboczym — bez niego wnioski trafiłyby na jednorazowy dysk systemowy
      RequiresMountsFor={{ wlb_export_queue_dir | dirname }} /sluza-out

      [Service]
      ExecStart=/usr/local/sbin/wlb-sluza-out-mover
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

- name: Katalog drop-in limitów śluzy (#149)
  ansible.builtin.file:
    path: /etc/systemd/system/wlb-sluza-out.service.d
    state: directory
    mode: "0755"

- name: Limity zasobów śluzy (#149)
  ansible.builtin.template:
    src: 60-resources.conf.j2
    dest: /etc/systemd/system/wlb-sluza-out.service.d/60-resources.conf
    mode: "0644"
  notify: Reload storage systemd

- name: Włącz usługę śluzy wyjściowej
  ansible.builtin.systemd_service:
    name: wlb-sluza-out.service
    enabled: true
    daemon_reload: true
