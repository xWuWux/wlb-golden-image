- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Restart auditd
  # auditd odmawia `systemctl restart` (RefuseManualStop) — tylko skrypt init potrafi go zrestartować
  ansible.builtin.command: service auditd restart  # noqa: command-instead-of-module
  changed_when: true
