# Aplikacje GUI flavora wlb-memory (#105). Nakładane na warstwę pulpitu (rola desktop) — analogicznie
# do roli neuro_apps na flavorze wlb-radiologia. Pierwsza aplikacja: LibreOffice Calc (arkusz, zamiennik
# GraphPad Prism — warstwa arkuszowa). Kolejne pozycje #105 (jamovi #90, LabPlot/SciDAVis, kafelek Leaf)
# dojdą do TEJ roli osobnymi PR-ami. Build warstwowy Packera (desktop.yml): role desktop + memory_apps
# na gotowym obrazie wlb-general — baza zostaje lekka (§ „Poza zakresem obrazu" w #105).

- name: Arkusz kalkulacyjny — LibreOffice Calc (+ natywny VCL GTK3 pod XFCE)
  ansible.builtin.apt:
    update_cache: true
    name:
      # Sam Calc + libreoffice-core; bez Writer/Impress/Base — mniejszy obraz niż metapakiet libreoffice.
      - libreoffice-calc
      # Natywny plugin VCL GTK3 — bez niego LibreOffice spada na plugin "gen" (czyste X11), który pod
      # XFCE renderuje się brzydko i niespójnie z pulpitem. Zależności GTK3 są już w obrazie (XFCE).
      - libreoffice-gtk3
    state: present

# libreoffice-common dostarcza profile AppArmor z flags=(complain), a rola base wymusza enforce
# PRZED tą warstwą (obraz wlb-general). Bez przełączenia akceptacja 20-apparmor.sh pada na liczniku
# profili w complain (CIS 1.6.3, #65). Przełączamy wszystkie nowe profile w complain — nie tylko
# znane z nazwy, bo zależności mogą dołożyć kolejne.
- name: Profile AppArmor w trybie enforce po instalacji LibreOffice (#65, CIS 1.6.3)
  ansible.builtin.shell: |
    set -o pipefail
    before=$(aa-status --complaining)
    if [[ ! $before =~ ^[0-9]+$ ]]; then
      echo "BŁĄD (#65): aa-status --complaining zwróciło '${before}'" >&2
      exit 1
    fi
    if ((before == 0)); then
      echo "aa-status --complaining=0 — brak profili do przełączenia"
      echo "WLB_SWITCHED=0"
      exit 0
    fi
    mapfile -t names < <(aa-status --json | python3 -c 'import json,sys; [print(n) for n,m in json.load(sys.stdin)["profiles"].items() if m=="complain"]')
    if [[ -z "${names[*]:-}" ]]; then
      echo "BŁĄD (#65): $before profili w complain, ale aa-status --json nie zwróciło nazw" >&2
      exit 1
    fi
    echo "Profile w trybie complain (before=$before): ${names[*]}"
    switched=0
    mapfile -t files < <(grep -rl 'flags=(complain' /etc/apparmor.d/ 2>/dev/null || true)
    for f in "${files[@]}"; do
      defined=$(apparmor_parser -N "$f" 2>/dev/null || true)
      for n in "${names[@]}"; do
        if grep -qxF -- "$n" <<<"$defined"; then
          aa-enforce "$f"
          switched=1
          break
        fi
      done
    done
    after=$(aa-status --complaining)
    echo "aa-status --complaining: before=$before after=$after"
    if [[ $after != 0 ]]; then
      echo "BŁĄD (#65): po aa-enforce nadal $after profili w trybie complain" >&2
      exit 1
    fi
    echo "WLB_SWITCHED=$switched"
  args:
    executable: /bin/bash
  register: memory_apps_complain_enforce
  changed_when: "'WLB_SWITCHED=1' in memory_apps_complain_enforce.stdout"

# LibreOffice (zależności GUI) potrafi wciągnąć apport z powrotem — rola desktop już go usuwała (#63),
# bo apport przy starcie ustawia fs.suid_dumpable=2 i niweczy nasz sysctl=0. Pilnujemy ponownie w tej
# warstwie (idempotentne, jeśli apport już nieobecny).
- name: Ponowne usunięcie apport ewentualnie wciągniętego przez LibreOffice (#63)
  ansible.builtin.apt:
    name: apport
    state: absent
    purge: true
