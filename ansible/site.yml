- name: WLB golden image — VM Laboratorium z JupyterHub (ogólnego przeznaczenia)
  hosts: all
  become: true
  roles:
    - base
    - storage
    - tljh
    - python_env
    - r_env
    - julia_env
    - role: rstudio
      when: wlb_rstudio_enabled | bool
    - role: desktop
      when: wlb_desktop_enabled | bool
    - audit
    - logging
    - lab_config

  post_tasks:
    # Profil rsyslogd musi zostać w trybie enforce — na nim trzyma się odczyt CA SIEM i pól zaufanych
    # (#6). Weryfikacja w post_tasks, po wypłukaniu handlerów roli logging (Reload AppArmor rsyslogd):
    # to one ładują profil jako ostatnie, więc tylko tutaj widać jego końcowy tryb w jądrze.
    - name: Profil rsyslogd w trybie enforce (#6, CIS 1.6.3)
      ansible.builtin.shell: |
        set -o pipefail
        # aa-status (jako ścieżka profilu) wypisuje jego tryb: "enforce" albo "complain". Brak
        # "complain" w odpowiedzi (profil załadowany w enforce albo niezaładowany) = zadanie nic nie robi.
        if aa-status /usr/sbin/rsyslogd 2>/dev/null | grep -qi complain; then
          aa-enforce usr.sbin.rsyslogd
        fi
      args:
        executable: /bin/bash
      register: wlb_rsyslog_enforce
      changed_when: "'changed: yes' in (wlb_rsyslog_enforce.stdout | lower())"

    - name: Zbierz wersje składników
      ansible.builtin.shell: |
        set -o pipefail
        echo "R_VERSION=$(R --version | head -1 | awk '{print $3}')"
        echo "JULIA_VERSION=$(julia --version | awk '{print $3}')"
        echo "PYTHON_VERSION=$(/opt/tljh/user/bin/python -c 'import platform; print(platform.python_version())')"
        echo "JUPYTERHUB_VERSION=$(/opt/tljh/hub/bin/jupyterhub --version)"
        # pakiety systemowe powinny być aktualne (dist-upgrade w roli base) — raport w stage 5
        echo "PENDING_UPGRADES=$(apt-get -s dist-upgrade | grep -c '^Inst' || true)"
      args:
        executable: /bin/bash
      register: wlb_versions
      changed_when: false

    - name: Zapisz metadane obrazu
      ansible.builtin.copy:
        dest: /etc/wlb/image-release
        mode: "0644"
        content: |
          WLB_IMAGE_NAME={{ wlb_image_name }}
          WLB_IMAGE_VERSION={{ wlb_image_version }}
          WLB_IMAGE_DATE={{ wlb_image_date }}
          WLB_GIT_COMMIT={{ wlb_git_commit | default('') }}
          WLB_GIT_DESCRIBE={{ wlb_git_describe | default('') }}
          WLB_GIT_DIRTY={{ wlb_git_dirty | default('') }}
          WLB_BUILD_RUN={{ wlb_build_run | default('') }}
          TLJH_VERSION={{ tljh_version }}
          R_CRAN_SNAPSHOT={{ r_cran_snapshot_date }}
          {{ wlb_versions.stdout }}

    - name: Pobierz metadane obrazu do artefaktów budowania
      ansible.builtin.fetch:
        src: /etc/wlb/image-release
        dest: "{{ wlb_artifacts_dir }}/image-release"
        flat: true
