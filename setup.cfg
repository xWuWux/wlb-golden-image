# Konfiguracja mutmut 3.x dla stage 4b (testy mutacyjne w CI).
# mutmut czyta tę sekcję, bo repo nie ma pyproject.toml; zakres mutacji jest celowo wąski:
# tylko walidator wydania platformy, którego testy jednostkowe są szybkie i deterministyczne.
# Zmiana zakresu = zmiana tego pliku + próg PYTHON_MUTATION_MIN w ci/mutation.sh.
[mutmut]
source_paths=ci/verify_platform_images.py
pytest_add_cli_args_test_selection=tests/unit/test_verify_platform_images.py
# mutmut kopiuje tylko source_paths i tests/; walidator czyta katalog wydania i warianty Packera,
# więc te drzewa muszą być w katalogu mutants/, inaczej testy padają na braku plików.
also_copy=release
    packer
use_setproctitle=false
# Timeout mutanta: domyślne wartości dawały sporadyczny timeout przy --max-children 4 na
# współdzielonym runnerze (mutant #23 przechodzi w izolacji). Podnosimy zapas, żeby bramka nie
# czerwieniła się od flake'a; timeout nadal jest błędem w ci/mutation.sh.
timeout_constant=30
timeout_multiplier=3
